name: 清库存（一次性）

# 只在 2026-11-04 09:00（北京时间）跑一次，把撤稿后剩下的 3 篇旧稿一次发完。
# 之后按「每天两条」的新节奏继续。

on:
  schedule:
    - cron: "0 1 4 11 *"   # 2026-11-04 09:00 北京时间
  workflow_dispatch:

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4

      - name: 批量发送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BATCH: "1"
          BATCH1_N: "5"
        run: python3 .github/flush.py

      - name: 失败告警
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ALERT_TEXT: "清库存推送失败了。去 Actions 看「清库存（一次性）」。"
        run: python3 .github/alert.py
