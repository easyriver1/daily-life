name: 每日两条

on:
  schedule:
    # GitHub 用 UTC，+8 是北京时间
    - cron: "0 1 * * *"    # 北京时间 09:00 —— 正餐（书 / 技能 / 周报）
    - cron: "0 3 * * *"    # 北京时间 11:00 —— 小菜（bits 栏目）
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4

      - name: 判断时段
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "MODE=noon" >> $GITHUB_ENV
            echo "本次是小菜时段（11:00）"
          else
            echo "MODE=daily" >> $GITHUB_ENV
            echo "本次是正餐时段（09:00）"
          fi

      - name: 推送到手机
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          START_DATE: "2026-11-01"
        run: python3 .github/send.py

      - name: 失败告警
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 .github/alert.py
