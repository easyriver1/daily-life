name: 每日一条

on:
  schedule:
    # GitHub 用 UTC。04:30 UTC = 北京时间 12:30
    # 注意：GitHub 的定时任务常有 5–30 分钟延迟，属正常现象
    - cron: "30 4 * * *"
  # 允许在网页上手动点「Run workflow」测试，不用等到第二天
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4

      - name: 推送到手机
        env:
          # Server酱（推荐）：微信服务号收，免费每天 5 条，无需实名
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # pushplus 备用：需先完成实名认证（¥3.9 或 ¥10 会员）
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          START_DATE: "2026-11-02"
        run: python3 .github/send.py
