<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>每日快报</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#111315; --card:#191c1f; --ink:#e8e6e3; --dim:#8b9096;
    --accent:#c9a227; --line:#262a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.85;font-size:17px;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  header{
    position:sticky;top:0;z-index:10;background:rgba(17,19,21,.96);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 0 0;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
  .brand .meta{font-size:11px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{
    flex:1;text-align:center;padding:8px 0 10px;font-size:14px;
    color:var(--dim);border:0;background:transparent;font-family:inherit;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .date{padding:16px 0 0;font-size:12px;color:var(--accent);letter-spacing:1px}
  article{padding:14px 0 10px}
  article h2{font-size:23px;line-height:1.45;margin:0 0 20px;letter-spacing:.3px;font-weight:600}
  article p{margin:0 0 18px}
  article strong{color:#fff;font-weight:600}
  .source{
    margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7;
  }
  .history{padding:22px 0 56px}
  .history h3{font-size:11px;color:var(--dim);letter-spacing:2px;margin:0 0 12px;font-weight:500}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 15px;margin-bottom:8px;background:var(--card);
    border-radius:12px;cursor:pointer;border:1px solid transparent;
  }
  .item:active{border-color:var(--accent)}
  .item .n{flex:0 0 auto;font-size:11px;color:var(--dim);min-width:26px;padding-top:3px}
  .item .t{font-size:15px;line-height:1.55;flex:1}
  .item .t small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
  .item.read .t{color:#8b9096}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;opacity:0}
  .item.unread .dot{opacity:1}
  .empty{padding:30px 0;color:var(--dim);font-size:14px;text-align:center}
  footer{text-align:center;font-size:11px;color:#4e5459;padding:0 0 34px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>每日快报</h1>
      <span class="meta" id="colmeta"></span>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="date" id="dateline">—</div>
  <article id="post"></article>

  <section class="history">
    <h3 id="historytitle">往期</h3>
    <div id="list"></div>
  </section>

  <footer>
    <div id="counter"></div>
    <div id="pwa"></div>
    <div>内容源自公开书籍与公开课程，每个数字都可回溯</div>
  </footer>
</div>

<script>
const DATA = {"start": "2026-11-01", "schedule": ["books", "skills", "books", "skills", "books", "weekly", null], "columns": {"books": [{"title": "室友带回来一袋「山上捡的」蘑菇，我劝你别吃", "html": "<p>国庆回校，室友拎来一袋干货：「我妈在后山捡的，晒干了，特别香。」</p>\n<p>我没法判断那袋东西有没有毒——因为<strong>没有任何人能靠肉眼判断</strong>。</p>\n<p>中国疾控中心 2025 年调查了 <strong>828 起</strong>蘑菇中毒事件，<strong>2165 人</strong>中招，<strong>13 人</strong>死亡。这已是六年来最低：2019 到 2024 年每年 276 到 676 起，病死率 0.87% 到 2.86%。</p>\n<p>会毒人的蘑菇还在变多：2025 年鉴定出 <strong>138 种</strong>，其中 <strong>34 种</strong>是国内首次记录。「祖祖辈辈都这么吃」这句话，可能已经过期。</p>\n<p>那些辨别法呢？银针试毒——蘑菇毒素不含硫，银针变黑靠的恰恰是硫，跟有毒没毒无关。虫子吃过就没毒——剧毒蘑菇成熟后照样被虫啃。颜色鲜艳才有毒——有没有毒和颜色无关。高温油炸能去毒——不靠谱。</p>\n<p>中国疾控中心的结论是：「目前没有简单易行、快速有效的识别蘑菇是否有毒的方法。」</p>\n<p>所以最省事的处理就是别吃。已经吃了、觉得不对劲，立即去医院，别扛着也别自己催吐，把剩下的蘑菇或照片带上——中毒分好几种类型，医生认出是哪一种才好对症。</p>", "source": "第 1 节第 5 条 · 证据 A · 中国疾控中心 China CDC Weekly (2026)", "file": "001-hl-野生蘑菇.md"}, {"title": "比熬夜更伤的是：今晚一点睡，周末中午起", "html": "<p>室友的作息表是这样的：周一到周五凌晨一点半睡、七点半起，周末补到中午十一点。</p>\n<p>他觉得自己没熬夜——工作日欠的觉，周末一次性还清了。</p>\n<p>但身体不这么算。英国生物银行跟踪了约 6.1 万个戴腕表的人，按作息规律程度分成五档。较规律的那四档，比最不规律的那一档，死亡风险低 <strong>20% 到 48%</strong>。研究结论很直接：<strong>作息规不规律，比睡多久更能预测死亡</strong>。</p>\n<p>还有一项追踪了 51,562 人的研究，记录睡眠时刻后发现：工作日和周末的睡眠中点如果差到 <strong>2 小时以上</strong>——这叫「社会时差」——心血管病风险高约 <strong>30%</strong>。哪怕每天睡够 7 小时，这个关联照样存在。</p>\n<p>那到底睡几个小时？16 项跟踪研究合起来算，138 万人、11.3 万例死亡，结论是：<strong>7 小时那一档风险最低</strong>。少于 7 小时，每少 1 小时风险高约 6%；多于 7 小时，每多 1 小时高约 13%。</p>\n<p>这里有个容易搞反的地方：睡得长的人风险高，多半是因果颠倒了——是抑郁、慢性病、睡眠呼吸暂停让人睡得多，不是睡得多让人生病。<strong>没有人建议你少睡。</strong></p>\n<p>所以真正要改的只有两件：睡够 7 小时，把上床和起床的点固定住。</p>\n<p>不是要你早睡，是要你<strong>别在几个时区之间来回跳</strong>——周五两点、周日两点、周一十一点，身体每一次都要重调。</p>", "source": "第 2 节第 13 条 · 证据 A（作息部分单独看为 B）· Cappuccio 等 (2010) Sleep 汇总分析", "file": "002-hl-睡够七小时.md"}, {"title": "电梯等在那儿，你走楼梯上去——每天攒够四分钟就够", "html": "<p>下课回宿舍，电梯口排了七八个人。楼梯就在旁边，四层，你犹豫了三秒，还是站进队伍里。</p>\n<p>「反正也不差这一分钟。」</p>\n<p>英国生物银行跟踪了 2.52 万个平时完全不锻炼的人，平均 6.9 年，其中 852 人去世。研究里有一批人，每天有 3 次、每次 1–2 分钟的<strong>零碎剧烈活动</strong>——爬楼梯、快走赶路这种，不换衣服、不去健身房，就嵌在生活里。和完全没有的人比：</p>\n<p>- 死亡风险、癌症死亡风险降低 <strong>38%–40%</strong><br>- 心血管死亡风险降低 <strong>48%–49%</strong></p>\n<p>每天这类活动累计到 <strong>4.4 分钟</strong>的人，收益小一些但仍在：死亡和癌症死亡降 26%–30%，心血管死亡降 32%–34%。</p>\n<p>注意研究对象——<strong>平时完全不锻炼的人</strong>。如果你已经有规律运动，这条对你不适用，别拿它当替代品。</p>\n<p>也得说清它的局限：这是跟踪记录，没做分组试验，只跟了 6.9 年。好处是活动量靠可穿戴设备实测，不是让人回忆填问卷，比大多数同类研究可靠。</p>\n<p>所以这条建议的成本接近零：不花钱，不占额外时间，<strong>唯一的难点是记得</strong>——电梯来了不进去，快递柜在楼下就走快两步。</p>\n<p>四分钟，不是四十分钟。你缺的从来不是时间。</p>", "source": "第 2 节第 15 条 · 证据 A · Stamatakis 等 (2022) Nature Medicine", "file": "003-hl-零碎用力.md"}], "skills": [{"title": "你现在双击的那个图标，其实就是一条命令", "html": "<p>桌面上的 Chrome 图标，双击就能打开。命令行里敲一行字，也能打开同一个东西——差别只在于：<strong>一个用鼠标指，一个用文字说</strong>。</p>\n<p>双击时系统做的事，其实是「按记录下来的路径启动这个程序」。命令行只是把这一步交给你自己写。</p>\n<p>那为什么还要用它？因为鼠标只能做一件事一次，而文字可以<strong>组合、记录、重复</strong>：把三条命令接起来一次跑完，或者存成文件明天再跑一遍。这就是命令行真正的价值——不是更酷，是<strong>能复用</strong>。</p>\n<p>Windows 上的「PowerShell」或「命令提示符」，macOS/Linux 上的「终端」，都是同一个东西的不同外壳。看到「在终端里执行」这句话，不用紧张，它只是换了个方式打开你已经会的程序。</p>\n<p><strong>今天能懂的一点</strong>：命令行不是程序员的黑话，它是「用文字操作系统」的入口，你已经在用它的图形版。</p>", "source": "技能线 001 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "001-cli-命令行是什么.md"}, {"title": "256G 的手机，开机就只剩 230G——不是厂商骗你", "html": "<p>新手机到手，包装上写着 256G。开机进设置一看，容量那一栏写着 238.4G，再扣掉系统和预装，可用的只剩 229G 左右。</p>\n<p>很多人的第一反应是「被坑了」。其实这里面没有任何欺诈，只有两套单位在打架——而这个打架的根源，和你以后看到的每一条带宽广告都有关。</p>\n<p>## 数字是怎么对不上的</p>\n<p>厂商说的 256G，是 <strong>256 × 10⁹ 字节</strong>，也就是 2560 亿个字节。这是国际单位制里的「G」，一 G 就是十亿。</p>\n<p>系统显示的，是按 <strong>1024 进制</strong>折算的。它把 2560 亿字节除以 1024 三次，得到约 <strong>238.4</strong>，然后标上 G。</p>\n<p>同样是 2560 亿字节，一个说 256，一个说 238。差的那 7%，不是被谁拿走了，是同一个数用了两把尺子。</p>\n<p>## 为什么电脑非要用 1024</p>\n<p>这才是关键。如果只是「单位不统一」，改成统一的不就完了？改不了，因为<strong>计算机的容量天生就是 2 的幂</strong>。</p>\n<p>想想内存怎么存一个数：一根存储单元只能表示两种状态，有电或没电。这是一个比特。八根并排就是 256 种组合，够表示一个字节的全部取值。根本不需要别的进制——它就是二进制的物理实体。</p>\n<p>既然地址是按二进制编的，容量自然就长成 1、2、4、8、16、32、256、512 这样的数。你不可能买到一根「1000 个单元」的内存条，它要么是 1024，要么是 2048。</p>\n<p>于是「1024 是一千」成了这个圈子的习惯，久了就有了专门的写法：1024 进制叫 <strong>GiB</strong>，十进制叫 <strong>GB</strong>。硬盘厂按 GB 卖，操作系统按 GiB 显示，两套并行了几十年。</p>\n<p>## 这个知识有什么用</p>\n<p>它不是一个冷知识，它是一把尺子。你以后会反复用到它：</p>\n<p><strong>宽带。</strong> 办 100M 宽带，下载速度显示 12.5MB/s。不是运营商缺斤少两——这里的 M 是<strong>比特</strong>，那里的是<strong>字节</strong>，一个字节等于八个比特。100 ÷ 8 = 12.5。看懂这一条，可以少打很多客服电话。</p>\n<p><strong>内存与显存。</strong> 为什么内存条总是 8G、16G、32G，从不出现 10G？同理，它是按二进制长出来的，不是按你的喜好。</p>\n<p><strong>存储卡。</strong> 标 128G 的卡，实际写入大约 119GiB。也是这个换算。</p>\n<p>## 一条边界</p>\n<p>这套解释只适用于「容量为什么对不上」。<strong>系统占掉的那几十个 G 是真占</strong>——预装应用、恢复分区、文件系统本身的索引，这些确实是硬件之外的开销。两部分原因叠在一起，才有了「256 变 229」这个结果。</p>\n<p>## 留给你的问题</p>\n<p>既然存储是二进制的、容量总是 2 的幂，那<strong>为什么硬盘厂不干脆按 1024 卖，省得大家误会？</strong></p>\n<p>（答案下周周报里说。你也可以先自己想一想：一台标着 1TB 的硬盘，如果真按 1024 进制做，成本会高多少？）</p>", "source": "概念 002 · 二进制与容量单位 · 数据来源：IEC 80000-13 单位标准", "file": "002-概念-256G为什么变230G.md"}], "weekly": [{"title": "第 1 期 · 你其实每天只需要四分钟", "html": "<p>这是第一份周报。往后每周六早上，它会把这一周的东西串起来，再给你一个三十分钟内能做完的动作。</p>\n<p>## 本周的六篇，其实在讲同一件事</p>\n<p><strong>书线两篇</strong>：蘑菇那篇讲「没有可靠的鉴别方法，那就别赌」；睡眠那篇讲「作息规律比睡多久更要命」；今天这篇讲「每天四分钟的零碎用力就够」。</p>\n<p>拼起来是同一个判断方式：<strong>先找那条最省力的边界，再决定要不要越过它</strong>。不吃野蘑菇是省力的，固定起床时间是省力的，走楼梯是省力的——它们都不要求你变成一个更自律的人。</p>\n<p><strong>技能线两篇</strong>：命令行到底是什么、路径为什么找不到文件。这两篇没有让你立刻去做任何事，它们在做另一件事：<strong>把你每天点的图标，还原成程序和数据</strong>。</p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：让命令行第一次替你干活，而不是听你描述它。</p>\n<p>1. 按 `Win+R`，输入 `powershell`，回车（5 分钟，包括翻出这个窗口）<br>2. 敲 `cd $HOME`，回车——你会「走」到自己的用户目录<br>3. 敲 `dir`，回车——看看里面有什么，和你在资源管理器里看到的是不是同一批东西<br>4. 挑一个文件夹，`cd 它的名字`，再 `dir` 一次<br>5. 敲 `cd ..` 退回来，重复两三次</p>\n<p><strong>做完的标准</strong>：你能不看提示，说出「我现在在哪」和「怎么回上一层」。</p>\n<p>做不到也没关系——下周的技能稿会接着讲。这一步的全部意义是：让「命令行」从一个名词变成一个你摸过的东西。</p>\n<p>## 本周深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| （本周没有） | — |</p>\n<p>第一篇长文随时可以找我要，主题由你选或者我推荐。读完再要下一篇。</p>", "source": "周报第 1 期 · 2026-11-02 至 2026-11-07", "file": "001-第1期.md"}], "longform": [{"title": "你每天早上收到的那条推送，是怎么跑到你手机里的", "html": "<p>早上九点，手机响了一下，微信里出现一段文字。你点开读两分钟，然后关掉。</p>\n<p>这件事看起来平淡，但中间其实经过了<strong>四台不同的机器、三个不同的公司</strong>。这篇文章把这四步拆开给你看——因为只要看懂一次，你对「互联网怎么运作」的直觉就建立了一半。</p>\n<p>## 一、起点：一个文本文件</p>\n<p>那篇文章，本质上一个纯文本文件，存在我电脑的一个文件夹里。文件名像这样：</p>\n<p>```<br>articles/books/003-hl-零碎用力.md<br>```</p>\n<p>`articles` 是文件夹，`books` 是栏目，后面是文件名。<strong>它的全部内容就是几百个汉字</strong>，加上第一行的标题和最后一行的小字出处。</p>\n<p>没有数据库，没有页面，就是一个 `.md` 文件。</p>\n<p>## 二、第一跳：文件被送到 GitHub</p>\n<p>我改完文件后，敲一条命令，文件被「推」到 GitHub 上的一个仓库里。</p>\n<p>GitHub 是一家美国的代码托管公司。它给你三样东西：<strong>存文件的地方、版本历史、以及一台能替你跑程序的服务器</strong>。</p>\n<p>第三样最关键。它意味着——<strong>我的电脑可以关机，程序照样有人跑</strong>。</p>\n<p>## 三、第二跳：定时器叫醒了程序</p>\n<p>GitHub 里有一条配置，长这样：</p>\n<p>```yaml<br>on:<br>  schedule:<br>    - cron: \"0 1 * * *\"<br>```</p>\n<p>这行 `cron` 的意思是「每天 01:00（UTC）」。UTC 比北京时间晚 8 小时，所以它对应的是<strong>北京时间早上 9 点</strong>。</p>\n<p>这里有个常见的误会：<strong>没有人在等这行代码执行</strong>。GitHub 的调度器每分钟扫一次所有仓库的排期表，到点了就把那台虚拟服务器叫醒，跑一遍脚本，然后关掉。</p>\n<p>所以你收到的不是「有人按了发送」，而是「一台机器按时开了机」。</p>\n<p>## 四、第三跳：脚本把文件变成消息</p>\n<p>被叫醒的那台机器上，跑的是我写的一个 Python 脚本。它干四件事：</p>\n<p>1. 看看今天是几号、星期几<br>2. 按排期决定今天该发哪个栏目<br>3. 从栏目文件夹里按顺序取出一篇<br>4. 把正文转成一条消息，发给 Server酱</p>\n<p>第 4 步值得多说一句。那篇文章是 Markdown 格式（`<strong>加粗</strong>`、空行分段），而微信要的是渲染好的文本。所以脚本会把 Markdown 转成带格式的字符串，再把最后一行的出处变成斜体小字。</p>\n<p><strong>你看到的每条消息，都是在这一刻被「翻译」出来的</strong>，不是原文。</p>\n<p>## 五、第四跳：Server酱把它塞进微信</p>\n<p>Server酱是一个国内的小服务，作用是<strong>中转</strong>。我给它一个密钥和一段文字，它就通过微信服务号把消息送到关注者的手机上。</p>\n<p>为什么要它？因为微信不开放「任何人给你发消息」的能力。只有认证过的服务号能发，而且要走微信的模板消息通道。Server酱做的就是替无数个人开发者跑完这套手续。</p>\n<p>它的免费额度是<strong>每天 5 条</strong>——这也是为什么这套系统每天只发两条，且要盯着别超。</p>\n<p>## 六、为什么会延迟</p>\n<p>你可能会发现，说好的 9 点，有时 9 点零六分才到。原因有层：</p>\n<p><strong>第一层是调度延迟。</strong> GitHub 自己的文档就写着，定时任务不保证准点，高峰期可能推迟几十分钟。它在排队。</p>\n<p><strong>第二层是运行时间。</strong> 服务器从冷启动到跑完脚本，通常十几秒。</p>\n<p><strong>第三层是投递。</strong> Server酱 → 微信服务号 → 你的手机，中间还要过推送通道。</p>\n<p>所以「9 点整」从一开始就不是承诺，是<strong>大概</strong>。</p>\n<p>## 七、失败长什么样</p>\n<p>这套系统最危险的地方，是它<strong>失败的时候可能看起来像成功</strong>。</p>\n<p>比如稿件用完了：脚本不会报错，它会安静地发一条「稿件已用完」。比如某天限额超了：消息根本发不出去，但调度器只关心「程序有没有崩溃」，没崩溃就显示绿色的对勾。</p>\n<p><strong>绿色对勾只代表脚本跑完了，不代表消息到了你手上。</strong> 这是所有自动化系统共有的盲区——它监控的是过程，不是结果。</p>\n<p>所以我给这套东西加了三道保险：库存预警、失败告警、以及一个「断更」提示。它们的作用不是让系统更可靠，而是<strong>让故障显形</strong>。</p>\n<p>## 八、这条链路的一般规律</p>\n<p>把这个例子推广开：<strong>任何「自动送达」的系统，都只有三样东西。</strong></p>\n<p>| 环节 | 这里的实现 | 换成别的场景 |<br>|---|---|---|<br>| <strong>存储</strong> | GitHub 仓库里的 md 文件 | 数据库、网盘、邮件附件 |<br>| <strong>触发</strong> | cron 定时器 | 用户点击、别人发消息、传感器报警 |<br>| <strong>投递</strong> | Server酱 → 微信 | 短信网关、邮件服务器、推送 SDK |</p>\n<p>你手机上每一个「自动」发生的事情——外卖状态更新、银行扣款提醒、课程表通知——背后都是这三样东西在接力。</p>\n<p>看懂一次，以后遇到任何「为什么我没收到」，你都知道该从哪一环开始查：是内容没生成？是触发没发生？还是投递被拦了？</p>\n<p>## 你现在就能验证</p>\n<p>如果你用的是安卓手机，打开微信里那条推送，长按它，看看有没有「查看来源」之类的选项。你会看到一条来自「服务号」的消息记录。</p>\n<p>再打开浏览器访问 `github.com/easyriver1/daily-life`，看那个仓库的 `Actions` 标签页——那里有每一次运行的记录，包括什么时候被叫醒、跑了多少秒、成功还是失败。</p>\n<p><strong>这两处加起来，就是这条链路的全部真相。</strong></p>", "source": "长文 001 · 基于本项目真实运行链路，可对照 GitHub 仓库的 Actions 记录验证", "file": "001-推送是怎么到手机的.md"}, {"title": "网站存的不是你密码，是你密码的指纹", "html": "<p>每隔一阵就有新闻：某网站被拖库，几百万条账号密码流出。</p>\n<p>然后大部分人的第一反应是「改密码」。但更好的问题是：<strong>一个正经的网站，凭什么能验证你输对了密码，却不知道你的密码是什么？</strong></p>\n<p>如果你能想明白这件事，你对「密码安全」的理解就超过大多数人。</p>\n<p>## 一、最笨也最常见的做法</p>\n<p>服务器上有一张表：</p>\n<p>| 账号 | 密码 |<br>|---|---|<br>| zhangsan | abc123 |<br>| lisi | woaini520 |</p>\n<p>你登录时，它拿你输的密码跟表里比一比，一样就放行。</p>\n<p>这个做法的问题一目了然：<strong>只要这张表泄露，所有人的密码就泄露了</strong>。而且不只是这个网站——很多人同一个密码用五个网站，一挂挂五处。</p>\n<p>这种表曾经真的很常见，而且现在仍然有。</p>\n<p>## 二、换个思路：不存密码，存指纹</p>\n<p>密码不该被「保存」，只该被「验证」。于是有人想到：能不能存一个只能验证、不能还原的东西？</p>\n<p>能。数学上这个东西叫<strong>哈希函数</strong>。</p>\n<p>它的特点是：输入任意内容，输出一串固定长度的字符；而且<strong>不可逆</strong>——给你输出，几乎不可能算出输入。</p>\n<p>比如你的密码是 `abc123`，做一次 SHA-256，得到：</p>\n<p>```<br>6ca13d52ca70c883e0f0bb101e425a89e8624de51db2d2392593af6a84118090<br>```</p>\n<p>网站存这串东西。你下次登录再输 `abc123`，它再算一遍，得到同一串，比一比，一样就放行。</p>\n<p><strong>整张表泄露也没关系</strong>——攻击者拿到的是一堆乱码，不知道原始密码是什么。</p>\n<p>## 三、但这里有个坑：猜得出来</p>\n<p>哈希不可逆，这句话成立的前提是「暴力破解算不过来」。可惜，<strong>常见密码的攻击者根本不用暴力破解</strong>。</p>\n<p>因为「密码 → 哈希」这个计算是公开的、极快的。攻击者可以拿一个密码字典（几亿条常见密码），一次性全部算成哈希，做成一张对照表。这叫<strong>彩虹表</strong>。</p>\n<p>你那张泄露的表里，只要有一个 `6ca13d52...`，他查表就知道是 `abc123`。</p>\n<p>而且算一次哈希只要微秒级。今天一块普通显卡每秒能算几十亿次。</p>\n<p>## 四、加盐：让同一密码算出不同指纹</p>\n<p>解决办法很朴素：<strong>在哈希之前，给每个用户加一段随机字符串</strong>。这段东西叫「盐」。</p>\n<p>```<br>哈希(盐 + 密码)<br>```</p>\n<p>你的盐是 `kX9#m`，我的盐是 `p2$Qz`。就算我们俩密码都是 `abc123`，算出来的哈希完全不同。</p>\n<p>盐和哈希一起存在表里——<strong>盐不需要保密</strong>，它的作用只是让预先算好的表失效。因为攻击者的表是按「无盐」算的，你的盐一加，那几亿条全部作废，他必须针对你这条单独重算。</p>\n<p>## 五、还不够：让哈希变慢</p>\n<p>加盐解决了「查表」，但没解决「逐条暴力破解」。密码短、字典小的话，照样能在合理时间内算完。</p>\n<p>于是又一步：<strong>让哈希函数故意变慢</strong>。</p>\n<p>普通的哈希（如 SHA-256）追求快；密码哈希恰恰相反，要设计成计算一次要花几十毫秒。这样攻击者每秒能试的次数从几十亿降到几万，成本上升几十万倍。</p>\n<p>这类专用函数有现成的：bcrypt、scrypt、Argon2。<strong>任何正经网站在 2026 年都应该用它们，而不是自己拿 SHA-256 凑。</strong></p>\n<p>## 六、哈希不是加密</p>\n<p>这两件事经常被混淆，但区别是根本性的：</p>\n<p>| | 加密 | 哈希 |<br>|---|---|---|<br>| 能不能还原 | 能（有密钥） | 不能 |<br>| 用途 | 传输、存储可还原的内容 | 验证内容一致 |<br>| 类比 | 上锁的箱子 | 指纹 |</p>\n<p>网站存密码用哈希，是因为它<strong>永远不需要知道你的密码</strong>——只需要知道「你输的和上次那个是不是同一个」。既然不需要，就不该有能力知道。</p>\n<p>反过来，如果一个网站给你发「您的密码是 xxx」的邮件，这只有一个解释：<strong>它存了明文</strong>。这是个危险信号，你应该换掉那个密码，并且以后少用它。</p>\n<p>## 七、你能做的事</p>\n<p>不用懂算法，只要做三件事：</p>\n<p><strong>第一，重要的账号不复用密码。</strong> 邮箱和支付工具的密码必须是独有的——因为它们是「找回其他所有账号」的钥匙。</p>\n<p><strong>第二，用密码管理器。</strong> 记不住二十个随机密码不是你的问题，是记忆机制的问题。浏览器自带的也行，至少比 `名字+生日+123` 强。</p>\n<p><strong>第三，能开两步验证就开。</strong> 它的价值在于：即使密码泄露，攻击者仍然过不了第二关。而且它防的正是本篇文章描述的那类事故。</p>\n<p>## 八、最后</p>\n<p>这篇没有一个数字需要你记住，但有一个判断标准值得带走：</p>\n<p><strong>下次看到「某网站被拖库」，先问一句「他们存的是哈希还是明文」。</strong> 如果是加盐的慢哈希，你的密码大概率没用；如果是明文，那才是真麻烦。</p>\n<p>这一个问题，就能把「恐慌」换成「判断」。</p>", "source": "长文 002 · 密码哈希与加盐为公开技术知识，可对照 OWASP 密码存储备忘单核实", "file": "002-密码的指纹.md"}, {"title": "平均数会骗人：三个数字陷阱", "html": "<p>看到一个数字，人的第一反应是「哦，是这样」。</p>\n<p>但数字本身不带含义，<strong>它靠的是你默认接受的那套算法</strong>。而这套算法，有三个地方经常被人有意无意地用错。</p>\n<p>这篇讲三个最常见的，都是你以后会在新闻、论文、广告里反复遇到的。</p>\n<p>## 陷阱一：平均数被少数人拉走</p>\n<p>假设一间办公室有 10 个人，9 个人月薪 6000，老板月薪 60 万。</p>\n<p>平均月薪 = （9×6000 + 600000）÷ 10 = <strong>65400 元</strong>。</p>\n<p>这个数字真实、算得没错，但它描述的「平均那个人」根本不存在——10 个人里 9 个远低于它。</p>\n<p>问题出在哪？<strong>平均数对极端值极其敏感。</strong> 一个极大的数就能把它整个拽走。</p>\n<p>所以更稳的是<strong>中位数</strong>：把所有人的收入排成一队，站在正中间那个人的数。在这个例子里，中位数是 6000。</p>\n<p>「平均工资 65400」和「中位数工资 6000」都没撒谎，但后者才告诉你「普通人是什么样」。</p>\n<p><strong>经验法则</strong>：凡是分布有长尾巴的东西——收入、房价、阅读量、粉丝数、代码提交次数——看中位数比看平均数可靠。</p>\n<p>## 陷阱二：幸存者偏差（只看活下来的）</p>\n<p>二战时有个著名的故事：工程师统计返航飞机的弹孔分布，发现机翼弹孔最多，引擎最少，于是提议加固机翼。</p>\n<p>结论恰好反了。<strong>因为被击中引擎的飞机根本没回来</strong>——你统计到的样本，是已经通过筛选的那部分。</p>\n<p>这就是幸存者偏差：<strong>当样本的「存活」本身与你要研究的东西相关时，剩下的样本不能代表全体。</strong></p>\n<p>它在生活里到处都是：</p>\n<p>- 「×× 辍学创业成了亿万富翁」——那些辍学创业失败的人没有记者采访<br>- 「每天跑 10 公里，我身体特别好」——跑出问题的人已经退出跑圈了<br>- 「用了这个方法，我考上了」——没考上的不会发帖</p>\n<p><strong>经验法则</strong>：看到「他们都成功了」的时候，先问「失败的那批人为什么不在样本里」。</p>\n<p>## 陷阱三：百分比没告诉你基数</p>\n<p>「风险降低 50%」听起来很厉害，但它没说降低的是从多少降到多少。</p>\n<p>如果原来 1000 个人里有 2 个人得病，降低 50% 是变成 1 个人。你为了这 1 个人，可能要吃十年药、体检一千次。</p>\n<p>如果原来是 1000 个人里有 200 个，降低 50% 就是少 100 个人——这才是真值得。</p>\n<p><strong>这叫「相对风险」与「绝对风险」的区别。</strong> 新闻里说的「降低 XX%」，绝大多数是相对值。而决定你要不要行动的是<strong>绝对值</strong>。</p>\n<p><strong>经验法则</strong>：看到百分比，一定要问「基数是多大」。答不出来，那个百分比就没有决策价值。</p>\n<p>## 把三个陷阱连起来看</p>\n<p>你会发现它们在问同一件事：<strong>这个数字，是在描述「谁」？</strong></p>\n<p>- 平均数问的是「这个样本里有没有极端值」<br>- 幸存者偏差问的是「这个样本是怎么被筛出来的」<br>- 百分比基数问的是「这个比例背后站着多少人」</p>\n<p>三个问题都不需要数学知识，只需要一个习惯：<strong>看到数字，问一句它描述的是哪一个群体。</strong></p>\n<p>## 你现在可以做的练习</p>\n<p>下面三句话，各藏着一个陷阱，你可以先自己判断，再看括号里的答案：</p>\n<p>1. 「我们学校毕业生平均起薪 1.2 万。」（平均数：有没有极少数高薪把人拉上去？中位数是多少？）<br>2. 「坚持早起的人，成功率高 30%。」（幸存者偏差 + 因果倒置：可能是成功的人更容易早起，而不是反过来）<br>3. 「这款牙膏能降低牙龈出血 45%。」（基数：原来出血率是多少？1% 降到 0.55% 值不值？）</p>\n<p>下次再遇到类似的说法，不用算，只要问一句：<strong>它在描述谁？</strong></p>", "source": "长文 003 · 平均数与中位数的差异、幸存者偏差均为公开统计学常识，可对照任意统计学导论教材核实", "file": "003-平均数会骗人.md"}], "bits": [{"title": "小菜 001 · 「论题」和「结论」不是一回事", "html": "<p>一条消息里通常有两样东西，很多人只看见第二样。</p>\n<p><strong>论题</strong>是问题本身：该不该熬夜？哪种学习方法更有效？这两个哪个更值得买？</p>\n<p><strong>结论</strong>是作者对这个问题给出的答案：不该熬夜、间隔重复更有效、买左边那个。</p>\n<p>## 为什么要分清</p>\n<p>因为<strong>论题决定了结论的分量</strong>。</p>\n<p>描述性论题问「是什么」，答案可以被事实推翻：「中国大学生平均每晚睡 6.8 小时」——查一下就知道了。</p>\n<p>规定性论题问「应该怎样」，答案没有标准解：「大学生应该 11 点睡」——这句话背后一定有某个价值判断（健康优先于自由，还是反过来）。</p>\n<p>把规定性论题当成描述性论题来吵，是最常见的无效争论：一个人说「应该」，另一个人拿数据反驳「实际不是这样」，两边根本不在同一个层面上。</p>\n<p>## 今天可以做的</p>\n<p>读一条消息时，先找那个<strong>问号</strong>。找不到问号，说明作者没打算回答具体问题——那他大概只是想表达情绪。</p>", "source": "小菜 · 概念速记", "file": "001-论题与结论.md"}, {"title": "小菜 002 · 「假设」是什么：作者没说出口的那句话", "html": "<p>一篇文章要成立，除了它写出来的理由，还必须依赖一些<strong>没写出来、但你必须接受</strong>的东西。这就是假设。</p>\n<p>## 一个例子</p>\n<p>「这台笔记本续航 12 小时，值得买。」</p>\n<p>表面上理由很硬：12 小时。但它依赖至少两个假设：</p>\n<p>1. 你确实需要长续航（不是一直插电用）<br>2. 12 小时是在你能接受的条件下测出来的（亮度、负载、几年后电池衰减）</p>\n<p>这两个假设都没写在文章里。如果第一个不成立，理由再硬也跟你无关。</p>\n<p>## 两类假设</p>\n<p><strong>描述性假设</strong>：关于世界是怎样的。「这个测评是独立做的」——它可能是枪文，那结论就废了。</p>\n<p><strong>价值观假设</strong>：关于什么更重要。「续航比性能重要」——这是价值判断，不是事实。</p>\n<p>## 为什么它有用</p>\n<p>因为一个论证的弱点，八成藏在假设里。理由通常都是真的（12 小时确实测出来了），出问题的是那句没说出口的前提。</p>\n<p>## 今天可以做的</p>\n<p>看到「所以」，往前推一步：<strong>要让这个「所以」成立，什么必须是真的？</strong> 那句话往往就是假设。</p>", "source": "小菜 · 概念速记", "file": "002-假设是什么.md"}]}, "meta": {"books": {"name": "书", "desc": "周一 / 周三 / 周五"}, "skills": {"name": "常识", "desc": "周二 / 周四"}, "weekly": {"name": "周报", "desc": "周六"}, "longform": {"name": "长文", "desc": "按需更新"}, "bits": {"name": "小菜", "desc": "每天 11:00"}}};

const fmt = d => { const p = n => String(n).padStart(2,'0'); return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; };
const DAY = 86400000;
const W = ['一','二','三','四','五','六','日'];

function today() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function bjToday() {
  const n = new Date(Date.now() + n0() + 8*3600000);
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function n0(){ return new Date().getTimezoneOffset()*60000; }

function dateAt(i){
  return new Date(Date.parse(DATA.start + "T00:00:00Z") + i*DAY);
}
function weekdayOf(d){ return (d.getUTCDay() + 6) % 7; }   // 0=周一
function todayIdx(){
  return Math.round((bjToday() - Date.parse(DATA.start + "T00:00:00Z")) / DAY);
}
function nthFor(col, upto){
  let n = 0;
  for (let i = 0; i <= upto; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col) n++;
  }
  return n;
}
function dateOfNth(col, n){
  let c = 0;
  for (let i = 0; ; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col){
      c++;
      if (c === n) return dateAt(i);
    }
    if (i > 5000) return null;
  }
}

/* ---- 已读标记 ---- */
const readKey = f => 'read:' + f;
const isRead = f => localStorage.getItem(readKey(f)) === '1';
const markRead = f => localStorage.setItem(readKey(f), '1');

let cur = localStorage.getItem('col') || 'books';
if (!DATA.columns[cur]) cur = Object.keys(DATA.columns)[0];

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = Object.keys(DATA.columns).map(k =>
    `<button class="tab${k===cur?' on':''}" data-k="${k}">${DATA.meta[k].name}</button>`
  ).join('');
  box.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    cur = el.dataset.k;
    localStorage.setItem('col', cur);
    renderTabs(); renderCol();
  });
}

function renderCol(){
  const list = DATA.columns[cur] || [];
  document.getElementById('colmeta').textContent = DATA.meta[cur].desc;

  const scheduled = [DATA.schedule || []].flat().includes(cur);
  let idx = 1, isToday = false;
  if (scheduled){
    const t = todayIdx();
    idx = Math.max(1, nthFor(cur, t));
    isToday = DATA.schedule[weekdayOf(bjToday())] === cur;
  }

  const post = document.getElementById('post');
  if (!list.length){
    post.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    document.getElementById('dateline').textContent = DATA.meta[cur].desc;
    document.getElementById('list').innerHTML = '';
    document.getElementById('historytitle').textContent = '往期';
    return;
  }

  const show = scheduled ? Math.min(idx, list.length) : list.length;
  const a = list[show - 1];
  markRead(a.file);

  if (scheduled){
    const d = dateOfNth(cur, show);
    const wd = d ? '星期' + W[weekdayOf(d)] : '';
    const dated = d ? `${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}` : '';
    document.getElementById('dateline').textContent =
      (isToday && show === idx) ? dated : `第 ${show} 篇 · ${dated}`;
  } else {
    document.getElementById('dateline').textContent = `共 ${list.length} 篇 · 按发布顺序排列`;
  }

  post.innerHTML = `<h2>${a.title}</h2>${a.html}` +
    (a.source ? `<div class="source">${a.source}</div>` : '');

  // 往期
  const rows = [];
  for (let i = list.length; i >= 1; i--){
    if (i === show) continue;
    const it = list[i-1];
    const dd = scheduled ? dateOfNth(cur, i) : null;
    const sub = dd ? `${dd.getUTCFullYear()} 年 ${dd.getUTCMonth()+1} 月 ${dd.getUTCDate()} 日` : '';
    rows.push(
      `<div class="item ${isRead(it.file)?'read':'unread'}" data-i="${i}">
         <div class="n">${String(i).padStart(2,'0')}</div>
         <div class="t">${it.title}<small>${sub}</small></div>
         <div class="dot"></div>
       </div>`
    );
  }
  document.getElementById('historytitle').textContent = `${DATA.meta[cur].name} · 往期`;
  document.getElementById('list').innerHTML = rows.join('') || '<div class="empty">还没有往期</div>';
  document.getElementById('list').querySelectorAll('.item').forEach(el => {
    el.onclick = () => openItem(+el.dataset.i);
  });

  updateCounter();
}

function updateCounter(){
  const list = DATA.columns[cur] || [];
  const readCount = list.filter(x => isRead(x.file)).length;
  const hint = cur === 'longform' ? '按需更新 · 不占排期' : '周一三五书 / 周二四技能 / 周六周报';
  document.getElementById('counter').textContent =
    `${DATA.meta[cur].name}：共 ${list.length} 篇 · 已读 ${readCount} 篇 · ${hint}`;
}

function openItem(i){
  const list = DATA.columns[cur] || [];
  const a = list[i-1];
  if (!a) return;
  markRead(a.file);
  const scheduled = [DATA.schedule || []].flat().includes(cur);
  const d = scheduled ? dateOfNth(cur, i) : null;
  const wd = d ? '星期' + W[weekdayOf(d)] : '';
  document.getElementById('dateline').textContent = d
    ? `第 ${i} 篇 · ${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}`
    : `第 ${i} 篇`;
  document.getElementById('post').innerHTML =
    `<h2>${a.title}</h2>${a.html}` + (a.source ? `<div class="source">${a.source}</div>` : '');
  window.scrollTo({top:0, behavior:'instant'});
  const el = document.querySelector('.item[data-i="' + i + '"]');
  if (el) { el.classList.remove('unread'); el.classList.add('read'); }
  updateCounter();
}

renderTabs();
renderCol();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').then(() => {
    const el = document.getElementById('pwa');
    if (el) el.textContent = '离线可读 · 可装到主屏幕';
  }).catch(() => {});
} else {
  const el = document.getElementById('pwa');
  if (el) el.textContent = '仅在线（要离线与安装需 HTTPS 站点）';
}
</script>
</body>
</html>
