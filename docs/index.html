<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>每日快报</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#111315; --card:#191c1f; --ink:#e8e6e3; --dim:#8b9096;
    --accent:#c9a227; --line:#262a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.85;font-size:17px;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  header{
    position:sticky;top:0;z-index:10;background:rgba(17,19,21,.96);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 0 0;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
  .brand .meta{font-size:11px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{
    flex:1;text-align:center;padding:8px 0 10px;font-size:14px;
    color:var(--dim);border:0;background:transparent;font-family:inherit;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .date{padding:16px 0 0;font-size:12px;color:var(--accent);letter-spacing:1px}
  article{padding:14px 0 10px}
  article h2{font-size:23px;line-height:1.45;margin:0 0 20px;letter-spacing:.3px;font-weight:600}
  article p{margin:0 0 18px}
  article strong{color:#fff;font-weight:600}
  .source{
    margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7;
  }
  .history{padding:22px 0 56px}
  .history h3{font-size:11px;color:var(--dim);letter-spacing:2px;margin:0 0 12px;font-weight:500}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 15px;margin-bottom:8px;background:var(--card);
    border-radius:12px;cursor:pointer;border:1px solid transparent;
  }
  .item:active{border-color:var(--accent)}
  .item .n{flex:0 0 auto;font-size:11px;color:var(--dim);min-width:26px;padding-top:3px}
  .item .t{font-size:15px;line-height:1.55;flex:1}
  .item .t small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
  .item.read .t{color:#8b9096}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;opacity:0}
  .item.unread .dot{opacity:1}
  .empty{padding:30px 0;color:var(--dim);font-size:14px;text-align:center}
  footer{text-align:center;font-size:11px;color:#4e5459;padding:0 0 34px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>每日快报</h1>
      <span class="meta" id="colmeta"></span>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="date" id="dateline">—</div>
  <article id="post"></article>

  <section class="history">
    <h3 id="historytitle">往期</h3>
    <div id="list"></div>
  </section>

  <footer>
    <div id="counter"></div>
    <div id="pwa"></div>
    <div>内容源自公开书籍与公开课程，每个数字都可回溯</div>
  </footer>
</div>

<script>
const DATA = {"start": "2026-11-01", "schedule": ["books", "skills", "books", "skills", "books", "weekly", null], "columns": {"books": [{"title": "室友带回来一袋「山上捡的」蘑菇，我劝你别吃", "html": "<p>国庆回校，室友拎来一袋干货：「我妈在后山捡的，晒干了，特别香。」</p>\n<p>我没法判断那袋东西有没有毒——因为<strong>没有任何人能靠肉眼判断</strong>。</p>\n<p>中国疾控中心 2025 年调查了 <strong>828 起</strong>蘑菇中毒事件，<strong>2165 人</strong>中招，<strong>13 人</strong>死亡。这已是六年来最低：2019 到 2024 年每年 276 到 676 起，病死率 0.87% 到 2.86%。</p>\n<p>会毒人的蘑菇还在变多：2025 年鉴定出 <strong>138 种</strong>，其中 <strong>34 种</strong>是国内首次记录。「祖祖辈辈都这么吃」这句话，可能已经过期。</p>\n<p>那些辨别法呢？银针试毒——蘑菇毒素不含硫，银针变黑靠的恰恰是硫，跟有毒没毒无关。虫子吃过就没毒——剧毒蘑菇成熟后照样被虫啃。颜色鲜艳才有毒——有没有毒和颜色无关。高温油炸能去毒——不靠谱。</p>\n<p>中国疾控中心的结论是：「目前没有简单易行、快速有效的识别蘑菇是否有毒的方法。」</p>\n<p>所以最省事的处理就是别吃。已经吃了、觉得不对劲，立即去医院，别扛着也别自己催吐，把剩下的蘑菇或照片带上——中毒分好几种类型，医生认出是哪一种才好对症。</p>", "source": "第 1 节第 5 条 · 证据 A · 中国疾控中心 China CDC Weekly (2026)", "file": "001-hl-野生蘑菇.md"}, {"title": "比熬夜更伤的是：今晚一点睡，周末中午起", "html": "<p>室友的作息表是这样的：周一到周五凌晨一点半睡、七点半起，周末补到中午十一点。</p>\n<p>他觉得自己没熬夜——工作日欠的觉，周末一次性还清了。</p>\n<p>但身体不这么算。英国生物银行跟踪了约 6.1 万个戴腕表的人，按作息规律程度分成五档。较规律的那四档，比最不规律的那一档，死亡风险低 <strong>20% 到 48%</strong>。研究结论很直接：<strong>作息规不规律，比睡多久更能预测死亡</strong>。</p>\n<p>还有一项追踪了 51,562 人的研究，记录睡眠时刻后发现：工作日和周末的睡眠中点如果差到 <strong>2 小时以上</strong>——这叫「社会时差」——心血管病风险高约 <strong>30%</strong>。哪怕每天睡够 7 小时，这个关联照样存在。</p>\n<p>那到底睡几个小时？16 项跟踪研究合起来算，138 万人、11.3 万例死亡，结论是：<strong>7 小时那一档风险最低</strong>。少于 7 小时，每少 1 小时风险高约 6%；多于 7 小时，每多 1 小时高约 13%。</p>\n<p>这里有个容易搞反的地方：睡得长的人风险高，多半是因果颠倒了——是抑郁、慢性病、睡眠呼吸暂停让人睡得多，不是睡得多让人生病。<strong>没有人建议你少睡。</strong></p>\n<p>所以真正要改的只有两件：睡够 7 小时，把上床和起床的点固定住。</p>\n<p>不是要你早睡，是要你<strong>别在几个时区之间来回跳</strong>——周五两点、周日两点、周一十一点，身体每一次都要重调。</p>", "source": "第 2 节第 13 条 · 证据 A（作息部分单独看为 B）· Cappuccio 等 (2010) Sleep 汇总分析", "file": "002-hl-睡够七小时.md"}, {"title": "电梯等在那儿，你走楼梯上去——每天攒够四分钟就够", "html": "<p>下课回宿舍，电梯口排了七八个人。楼梯就在旁边，四层，你犹豫了三秒，还是站进队伍里。</p>\n<p>「反正也不差这一分钟。」</p>\n<p>英国生物银行跟踪了 2.52 万个平时完全不锻炼的人，平均 6.9 年，其中 852 人去世。研究里有一批人，每天有 3 次、每次 1–2 分钟的<strong>零碎剧烈活动</strong>——爬楼梯、快走赶路这种，不换衣服、不去健身房，就嵌在生活里。和完全没有的人比：</p>\n<p>- 死亡风险、癌症死亡风险降低 <strong>38%–40%</strong><br>- 心血管死亡风险降低 <strong>48%–49%</strong></p>\n<p>每天这类活动累计到 <strong>4.4 分钟</strong>的人，收益小一些但仍在：死亡和癌症死亡降 26%–30%，心血管死亡降 32%–34%。</p>\n<p>注意研究对象——<strong>平时完全不锻炼的人</strong>。如果你已经有规律运动，这条对你不适用，别拿它当替代品。</p>\n<p>也得说清它的局限：这是跟踪记录，没做分组试验，只跟了 6.9 年。好处是活动量靠可穿戴设备实测，不是让人回忆填问卷，比大多数同类研究可靠。</p>\n<p>所以这条建议的成本接近零：不花钱，不占额外时间，<strong>唯一的难点是记得</strong>——电梯来了不进去，快递柜在楼下就走快两步。</p>\n<p>四分钟，不是四十分钟。你缺的从来不是时间。</p>", "source": "第 2 节第 15 条 · 证据 A · Stamatakis 等 (2022) Nature Medicine", "file": "003-hl-零碎用力.md"}], "skills": [{"title": "你现在双击的那个图标，其实就是一条命令", "html": "<p>桌面上的 Chrome 图标，双击就能打开。命令行里敲一行字，也能打开同一个东西——差别只在于：<strong>一个用鼠标指，一个用文字说</strong>。</p>\n<p>双击时系统做的事，其实是「按记录下来的路径启动这个程序」。命令行只是把这一步交给你自己写。</p>\n<p>那为什么还要用它？因为鼠标只能做一件事一次，而文字可以<strong>组合、记录、重复</strong>：把三条命令接起来一次跑完，或者存成文件明天再跑一遍。这就是命令行真正的价值——不是更酷，是<strong>能复用</strong>。</p>\n<p>Windows 上的「PowerShell」或「命令提示符」，macOS/Linux 上的「终端」，都是同一个东西的不同外壳。看到「在终端里执行」这句话，不用紧张，它只是换了个方式打开你已经会的程序。</p>\n<p><strong>今天能懂的一点</strong>：命令行不是程序员的黑话，它是「用文字操作系统」的入口，你已经在用它的图形版。</p>", "source": "技能线 001 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "001-cli-命令行是什么.md"}, {"title": "文件明明在桌面，程序却说「找不到」", "html": "<p>因为程序的世界里没有「桌面」这个概念。</p>\n<p>桌面只是资源管理器给你看的一个<strong>视图</strong>。程序看到的是地址：`C:\\Users\\Lenovo\\Desktop`。你说的「桌面」，系统理解成这串字符。</p>\n<p>这就引出路径的两种写法：</p>\n<p>- <strong>绝对路径</strong>：从盘符开始写全，`C:\\Users\\Lenovo\\Desktop\\笔记.txt`。无论你当前在哪，它都指向同一个文件。<br>- <strong>相对路径</strong>：从「我现在在哪」开始算。`笔记.txt` 表示当前目录下的那个文件。</p>\n<p>命令行里有个符号专门表示当前位置：`.`. `..` 表示上一级。所以 `cd ..` 是「往上退一层」。</p>\n<p>还有个高频坑：<strong>路径里有空格必须加引号</strong>。`C:\\Program Files` 会被拆成两个词，加引号才是一个整体。</p>\n<p><strong>今天能懂的一点</strong>：遇到「找不到文件」，第一步永远是拿完整路径去试。Windows 里按住 Shift 右键文件，选「复制为路径」，就能拿到程序认识的那种写法。</p>", "source": "技能线 002 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "002-cli-路径.md"}, {"title": "命令行里删文件，没有回收站", "html": "<p>四个动作，构成命令行管理文件的基本盘：</p>\n<p>| 动作 | Windows | macOS / Linux |<br>|---|---|---|<br>| 看有什么 | `dir` | `ls` |<br>| 复制 | `copy` | `cp` |<br>| 移动 / 改名 | `move` | `mv` |<br>| 删除 | `del` | `rm` |</p>\n<p>前三个都还好，<strong>第四个是唯一不可逆的</strong>：`rm` 和 `del` 直接抹掉文件，不进回收站。没有「撤销」，没有「还原」。</p>\n<p>危险的不是命令，是<strong>通配符</strong>。`rm *.txt` 里的 `*` 会匹配当前目录下所有 txt。敲之前你以为只有三个文件，实际可能有三十个。</p>\n<p>所以有个几乎所有人都会用的习惯：<strong>先列出来看，再删</strong>。</p>\n<p>```<br>ls *.txt      # 先看看匹配到哪些<br>rm *.txt      # 确认无误再执行<br>```</p>\n<p><strong>今天能懂的一点</strong>：命令行的威力来自「一条命令作用在一批文件上」，它的危险也来自同一处。按回车之前，先让命令告诉你它要动哪些文件。</p>", "source": "技能线 003 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "003-cli-文件操作.md"}, {"title": "五个小工具接起来，比一个全能软件好用", "html": "<p>命令行里最反直觉的一条设计：<strong>每个程序只做一件事，做到极致</strong>。</p>\n<p>`ls` 只负责列文件，`find` 只负责找文件，`sort` 只负责排序。单独看都很弱。但它们之间可以用一根竖线连起来：</p>\n<p>```<br>ls | sort | wc<br>```</p>\n<p>这根竖线叫<strong>管道</strong>（`|`），意思是：把前一个命令的输出，直接当作后一个命令的输入。上面这条命令就是：列出文件 → 排序 → 数一数有几个。</p>\n<p>同样的东西在图形界面里怎么做？打开文件夹、切到详细视图、点一下表头排序、再自己数。能做，但<strong>不能重复</strong>——明天换一个文件夹，你得再来一遍。</p>\n<p>这里还有第二个符号：`>`，叫<strong>重定向</strong>，把输出写到文件里而不是屏幕上。</p>\n<p>```<br>dir > 清单.txt<br>```</p>\n<p>所以命令行真正的能力不是「快」，而是<strong>把你的操作变成可以保存、可以再跑一遍的东西</strong>。</p>\n<p><strong>今天能懂的一点</strong>：当你发现自己在重复做同一套「找文件、筛内容、复制粘贴」的动作时，问一句——有没有一条命令能替我做完全程。</p>", "source": "技能线 004 · 参考 MIT《计算机教育中缺失的一课》· Shell 工具与脚本", "file": "004-cli-管道.md"}, {"title": "你以为 git 是备份，其实它记的是「为什么改」", "html": "<p>大多数人第一次听说 git，理解成「代码的网盘」。不对。</p>\n<p>如果只是想存旧版本，你完全可以这样：`论文_v1.doc`、`论文_v2.doc`、`论文_最终版.doc`、`论文_最终版2.doc`。</p>\n<p>这套办法的问题不是乱，是<strong>它只记录了「变了」，没记录「为什么变」</strong>。三天后你打开 `最终版2`，根本想不起来改了什么、为什么改。</p>\n<p>git 干的事是：每次改动都留一条记录，写清楚<strong>这次改了什么、为什么改</strong>，并且能把任意两个时刻的差异摆在你面前。</p>\n<p>它带来三个能力：</p>\n<p>1. <strong>回到任何一刻</strong>——不是「回到昨天的备份」，是回到「你写完那一段的那一刻」<br>2. <strong>看清差异</strong>——这两行是谁改的、什么时候、因为什么<br>3. <strong>多人并行</strong>——两个人改同一份文件，最后能被合到一起，而不是互相覆盖</p>\n<p>第三条是它真正被全世界采用的原因。没有版本控制，五个人改一份文档基本等于灾难。</p>\n<p><strong>今天能懂的一点</strong>：git 的价值不在于「存了文件」，在于它保存了<strong>改动的意图</strong>。这也是为什么提交时要写一句说明——那句话是三个月后的你能读懂的线索。</p>", "source": "技能线 005 · 参考 MIT《计算机教育中缺失的一课》· 版本控制(Git)", "file": "005-git-版本控制.md"}], "weekly": [{"title": "第 1 期 · 你其实每天只需要四分钟", "html": "<p>这是第一份周报。往后每周六早上，它会把这一周的东西串起来，再给你一个三十分钟内能做完的动作。</p>\n<p>## 本周的六篇，其实在讲同一件事</p>\n<p><strong>书线两篇</strong>：蘑菇那篇讲「没有可靠的鉴别方法，那就别赌」；睡眠那篇讲「作息规律比睡多久更要命」；今天这篇讲「每天四分钟的零碎用力就够」。</p>\n<p>拼起来是同一个判断方式：<strong>先找那条最省力的边界，再决定要不要越过它</strong>。不吃野蘑菇是省力的，固定起床时间是省力的，走楼梯是省力的——它们都不要求你变成一个更自律的人。</p>\n<p><strong>技能线两篇</strong>：命令行到底是什么、路径为什么找不到文件。这两篇没有让你立刻去做任何事，它们在做另一件事：<strong>把你每天点的图标，还原成程序和数据</strong>。</p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：让命令行第一次替你干活，而不是听你描述它。</p>\n<p>1. 按 `Win+R`，输入 `powershell`，回车（5 分钟，包括翻出这个窗口）<br>2. 敲 `cd $HOME`，回车——你会「走」到自己的用户目录<br>3. 敲 `dir`，回车——看看里面有什么，和你在资源管理器里看到的是不是同一批东西<br>4. 挑一个文件夹，`cd 它的名字`，再 `dir` 一次<br>5. 敲 `cd ..` 退回来，重复两三次</p>\n<p><strong>做完的标准</strong>：你能不看提示，说出「我现在在哪」和「怎么回上一层」。</p>\n<p>做不到也没关系——下周的技能稿会接着讲。这一步的全部意义是：让「命令行」从一个名词变成一个你摸过的东西。</p>\n<p>## 本周深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| （本周没有） | — |</p>\n<p>第一篇长文随时可以找我要，主题由你选或者我推荐。读完再要下一篇。</p>", "source": "周报第 1 期 · 2026-11-02 至 2026-11-07", "file": "001-第1期.md"}], "longform": [{"title": "我把一行代码改坏了，git 是怎么给我找回来的", "html": "<p>先讲一件真事。</p>\n<p>有人改了一个文件，提交了，第二天发现改错了，想回到昨天的样子。他没有备份，也没有网盘——他敲了一行命令，昨天那个版本就回来了。</p>\n<p>你可能会想：那不就是存了旧版本吗？</p>\n<p>不是。<strong>如果你知道它其实存了什么，这件事就一点都不神奇。</strong> 而且你还会顺便明白另外几个一直困惑你的问题：为什么建分支那么快、为什么 `rebase` 之后提交编号全变了。</p>\n<p>这篇就讲这一件事。</p>\n<p>---</p>\n<p>## 一、先做个实验</p>\n<p>随便找个空文件夹，在里面建一个文件，写上两行字，然后在 git 里提交一次。</p>\n<p>提交完，打开这个文件夹——你会看到多了一个叫 `.git` 的隐藏目录。</p>\n<p>git 全部的秘密都在这个目录里。<strong>你的项目代码和文档，git 一个字节都没备份</strong>；它备份的是这些文件在不同时刻的样子，而这些东西存在 `.git` 里。</p>\n<p>再往下走一层，有个 `objects` 目录。里面躺着几个名字很怪的子文件夹，文件夹名是两位十六进制，比如 `8d`，里面的文件名是一长串四十位的字符：</p>\n<p>```<br>8d0e41234f24b0b3ee86960f0d2aa76c5e1b0e3f<br>```</p>\n<p>这个四十位的东西，是<strong>用一个算法根据文件内容算出来的</strong>。同样的内容，永远算出同一个名字；内容差一个字，名字就完全不同。</p>\n<p>记住这一点，后面全靠它。</p>\n<p>---</p>\n<p>## 二、其实只有三个抽屉</p>\n<p>git 把所有东西塞进三个抽屉，没有第四种：</p>\n<p>| 抽屉 | 装什么 | 一句话记住 |<br>|---|---|---|<br>| <strong>文件内容</strong> | 某个文件的全部文字 | 稿纸 |<br>| <strong>目录清单</strong> | 这个目录下有哪些文件名，各自对应哪张稿纸 | 文件夹的目录页 |<br>| <strong>提交</strong> | 这次提交用了哪张目录页、上一张是哪张、谁写的、什么时候 | 照片背面写的说明 |</p>\n<p>现在有个细节值得停一下：<strong>「文件内容」那个抽屉里，没有文件名。</strong></p>\n<p>同样一段文字，你叫它 `笔记.txt` 还是 `备忘.txt`，存下来的内容抽屉完全一样。名字归<strong>目录清单</strong>管。</p>\n<p>这一下就解释了一件事：<strong>在 git 眼里，改文件名根本不叫改。</strong> 你只是把目录页上的一行改了，内容一个字都没动。这就是为什么 `git mv` 快到不像在做事。</p>\n<p>---</p>\n<p>## 三、`add` 和 `commit`，各做了一半</p>\n<p>你平时敲的两条命令，其实分工非常清楚：</p>\n<p><strong>`git add`</strong> —— 把文件当前的内容，算一个名字，存进「文件内容」抽屉。这时东西进去了，但还不算历史。</p>\n<p><strong>`git commit`</strong> —— 生成一张「目录清单」，再生成「提交」那张照片，照片上写着：这是哪张清单、上一张是谁、我为什么改。</p>\n<p>就这样。<strong>没有增量、没有差异数据库</strong>，每次提交都是一份完整快照。</p>\n<p>那为什么仓库不膨胀？因为内容没变的文件，算出来的名字一模一样，git 不会再存第二份。你改了一百次、每次只动一行，实际存的是一百份小改动加一份公共内容。</p>\n<p>---</p>\n<p>## 四、分支只是一张便利贴</p>\n<p>这条如果早知道，git 的很多命令会立刻顺眼。</p>\n<p>`.git` 里有个文件夹 `refs/heads/`，里面每个文件名就是一个分支名。用记事本打开它，内容是<strong>一行四十位的字符</strong>，指向某次提交。</p>\n<p>就这么多。一个分支 = 一个文本文件，里面一行字。</p>\n<p>所以：</p>\n<p>- <strong>建分支</strong> = 新建一个文件，写一行字。这就是它快的原因，快到你根本感觉不到。<br>- <strong>切分支</strong> = 换一个文件来读，再按那张目录清单把文件摆回工作区。<br>- <strong>快进合并</strong> = 把当前分支那个文件里的一行字，改成另一个分支的那行字。<strong>没有文件被复制。</strong></p>\n<p>---</p>\n<p>## 五、于是三个怪事不再怪</p>\n<p><strong>「为什么提交过的东西改不掉？」</strong></p>\n<p>因为提交的名字就是它内容的指纹。你一改，指纹就变了，它已经不是原来那张照片。这不是 git 不让你改，是这个东西在数学上就没法「原地改」。</p>\n<p><strong>「为什么 `rebase` 之后提交编号全变了？」</strong></p>\n<p>因为 `rebase` 是「把这些改动重新做一遍」。每重做一次就生成一张新照片，新照片的「上一张是谁」变了，指纹自然全变。它不是搬运，是重拍。</p>\n<p><strong>「为什么 `git status` 那么快？」</strong></p>\n<p>因为它不读你的文件内容。它把你的文件重新算一遍指纹，和清单上的指纹比对，对不上就是改了。几万个文件照样一秒。</p>\n<p>---</p>\n<p>## 六、你现在可以自己验证</p>\n<p>在你的项目文件夹里敲这三行（Windows 用 PowerShell）：</p>\n<p>```<br>git log --oneline -1         # 看一眼最新提交的编号<br>git cat-file -p HEAD         # 看这张「照片」背面写了什么<br>git cat-file -p HEAD^{tree}  # 看这次提交的「目录清单」<br>```</p>\n<p>第二条会直接吐出那张照片的内容：`tree`（哪张目录清单）、`parent`（上一张照片）、`author`、提交说明。第三条会吐出文件名和对应的那串指纹。</p>\n<p><strong>看到这些，你就不是在「相信」git 了，你是在看它。</strong></p>\n<p>---</p>\n<p>## 最后</p>\n<p>回到开头那件事：为什么改坏了能找回来？</p>\n<p>因为每一次提交都是一张独立存的照片，都在 `.git` 里。你以为的「覆盖保存」，实际上是「每次拍照都留底」。找回来，只是把书签挪回某张旧照片。</p>\n<p>理解了这个模型，git 就不再是一堆要背的命令，而是一个<strong>只会往抽屉里放东西、从不删东西的柜子</strong>。你要做的只是知道书签该贴在哪。</p>", "source": "长文 001 · 参考《Pro Git》第 10 章「Git 内部原理」", "file": "001-git里存了什么.md"}]}, "meta": {"books": {"name": "书", "desc": "周一 / 周三 / 周五"}, "skills": {"name": "技能", "desc": "周二 / 周四"}, "weekly": {"name": "周报", "desc": "周六"}, "longform": {"name": "长文", "desc": "按需更新 · 不占排期"}}};

const fmt = d => { const p = n => String(n).padStart(2,'0'); return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; };
const DAY = 86400000;
const W = ['一','二','三','四','五','六','日'];

function today() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function bjToday() {
  const n = new Date(Date.now() + n0() + 8*3600000);
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function n0(){ return new Date().getTimezoneOffset()*60000; }

function dateAt(i){
  return new Date(Date.parse(DATA.start + "T00:00:00Z") + i*DAY);
}
function weekdayOf(d){ return (d.getUTCDay() + 6) % 7; }   // 0=周一
function todayIdx(){
  return Math.round((bjToday() - Date.parse(DATA.start + "T00:00:00Z")) / DAY);
}
function nthFor(col, upto){
  let n = 0;
  for (let i = 0; i <= upto; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col) n++;
  }
  return n;
}
function dateOfNth(col, n){
  let c = 0;
  for (let i = 0; ; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col){
      c++;
      if (c === n) return dateAt(i);
    }
    if (i > 5000) return null;
  }
}

const readKey = f => 'read:' + f;
const isRead = f => localStorage.getItem(readKey(f)) === '1';
const markRead = f => localStorage.setItem(readKey(f), '1');

if (!DATA.columns[cur]) cur = Object.keys(DATA.columns)[0];

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = Object.keys(DATA.columns).map(k =>
    `<button class="tab${k===cur?' on':''}" data-k="${k}">${DATA.meta[k].name}</button>`
  ).join('');
  box.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    cur = el.dataset.k;
    localStorage.setItem('col', cur);
    renderTabs(); renderCol();
  });
}

function renderCol(){
  const list = DATA.columns[cur] || [];
  document.getElementById('colmeta').textContent = DATA.meta[cur].desc;

  const scheduled = [DATA.schedule || []].flat().includes(cur);
  let idx = 1, isToday = false;
  if (scheduled){
    const t = todayIdx();
    idx = Math.max(1, nthFor(cur, t));
    isToday = DATA.schedule[weekdayOf(bjToday())] === cur;
  }

  const post = document.getElementById('post');
  if (!list.length){
    post.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    document.getElementById('dateline').textContent = DATA.meta[cur].desc;
    document.getElementById('list').innerHTML = '';
    document.getElementById('historytitle').textContent = '往期';
    return;
  }

  const show = scheduled ? Math.min(idx, list.length) : list.length;
  const a = list[show - 1];
  markRead(a.file);

  if (scheduled){
    const d = dateOfNth(cur, show);
    const wd = d ? '星期' + W[weekdayOf(d)] : '';
    const dated = d ? `${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}` : '';
    document.getElementById('dateline').textContent =
      (isToday && show === idx) ? dated : `第 ${show} 篇 · ${dated}`;
  } else {
    document.getElementById('dateline').textContent = `共 ${list.length} 篇 · 按发布顺序排列`;
  }

  post.innerHTML = `<h2>${a.title}</h2>${a.html}` +
    (a.source ? `<div class="source">${a.source}</div>` : '');

  // 往期
  const rows = [];
  for (let i = list.length; i >= 1; i--){
    if (i === show) continue;
    const it = list[i-1];
    const dd = scheduled ? dateOfNth(cur, i) : null;
    const sub = dd ? `${dd.getUTCFullYear()} 年 ${dd.getUTCMonth()+1} 月 ${dd.getUTCDate()} 日` : '';
    rows.push(
      `<div class="item ${isRead(it.file)?'read':'unread'}" data-i="${i}">
         <div class="n">${String(i).padStart(2,'0')}</div>
         <div class="t">${it.title}<small>${sub}</small></div>
         <div class="dot"></div>
       </div>`
    );
  }
  document.getElementById('historytitle').textContent = `${DATA.meta[cur].name} · 往期`;
  document.getElementById('list').innerHTML = rows.join('') || '<div class="empty">还没有往期</div>';
  document.getElementById('list').querySelectorAll('.item').forEach(el => {
    el.onclick = () => openItem(+el.dataset.i);
  });

  updateCounter();
}

function updateCounter(){
  const list = DATA.columns[cur] || [];
  const readCount = list.filter(x => isRead(x.file)).length;
  const hint = cur === 'longform' ? '按需更新 · 不占排期' : '周一三五书 / 周二四技能 / 周六周报';
  document.getElementById('counter').textContent =
    `${DATA.meta[cur].name}：共 ${list.length} 篇 · 已读 ${readCount} 篇 · ${hint}`;
}

function openItem(i){
  const list = DATA.columns[cur] || [];
  const a = list[i-1];
  if (!a) return;
  markRead(a.file);
  const scheduled = [DATA.schedule || []].flat().includes(cur);
  const d = scheduled ? dateOfNth(cur, i) : null;
  const wd = d ? '星期' + W[weekdayOf(d)] : '';
  document.getElementById('dateline').textContent = d
    ? `第 ${i} 篇 · ${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}`
    : `第 ${i} 篇`;
  document.getElementById('post').innerHTML =
    `<h2>${a.title}</h2>${a.html}` + (a.source ? `<div class="source">${a.source}</div>` : '');
  window.scrollTo({top:0, behavior:'instant'});
  const el = document.querySelector('.item[data-i="' + i + '"]');
  if (el) { el.classList.remove('unread'); el.classList.add('read'); }
  updateCounter();
}

renderTabs();
renderCol();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').then(() => {
    const el = document.getElementById('pwa');
    if (el) el.textContent = '离线可读 · 可装到主屏幕';
  }).catch(() => {});
} else {
  const el = document.getElementById('pwa');
  if (el) el.textContent = '仅在线（要离线与安装需 HTTPS 站点）';
}
</script>
</body>
</html>
