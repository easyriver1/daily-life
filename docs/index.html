<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#111315; --card:#191c1f; --ink:#e8e6e3; --dim:#8b9096;
    --accent:#c9a227; --line:#262a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.85;font-size:17px;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  header{
    position:sticky;top:0;z-index:10;background:rgba(17,19,21,.96);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 0 0;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
  .brand .meta{font-size:11px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{
    flex:1;text-align:center;padding:8px 0 10px;font-size:14px;
    color:var(--dim);border:0;background:transparent;font-family:inherit;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .date{padding:16px 0 0;font-size:12px;color:var(--accent);letter-spacing:1px}
  article{padding:14px 0 10px}
  article h2{font-size:23px;line-height:1.45;margin:0 0 20px;letter-spacing:.3px;font-weight:600}
  article p{margin:0 0 18px}
  article strong{color:#fff;font-weight:600}
  .source{
    margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7;
  }
  .history{padding:22px 0 56px}
  .history h3{font-size:11px;color:var(--dim);letter-spacing:2px;margin:0 0 12px;font-weight:500}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 15px;margin-bottom:8px;background:var(--card);
    border-radius:12px;cursor:pointer;border:1px solid transparent;
  }
  .item:active{border-color:var(--accent)}
  .item .n{flex:0 0 auto;font-size:11px;color:var(--dim);min-width:26px;padding-top:3px}
  .item .t{font-size:15px;line-height:1.55;flex:1}
  .item .t small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
  .item.read .t{color:#8b9096}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;opacity:0}
  .item.unread .dot{opacity:1}
  .empty{padding:30px 0;color:var(--dim);font-size:14px;text-align:center}
  footer{text-align:center;font-size:11px;color:#4e5459;padding:0 0 34px;line-height:1.9}
</style>
</head>

<script>
const DATA = {"start": "2026-11-01", "schedule": ["books", "skills", "books", "skills", "books", "weekly", null], "columns": {"books": [{"title": "室友带回来一袋「山上捡的」蘑菇，我劝你别吃", "html": "<p>国庆回校，室友拎来一袋干货：「我妈在后山捡的，晒干了，特别香。」</p>\n<p>我没法判断那袋东西有没有毒——因为<strong>没有任何人能靠肉眼判断</strong>。</p>\n<p>中国疾控中心 2025 年调查了 <strong>828 起</strong>蘑菇中毒事件，<strong>2165 人</strong>中招，<strong>13 人</strong>死亡。这已是六年来最低：2019 到 2024 年每年 276 到 676 起，病死率 0.87% 到 2.86%。</p>\n<p>会毒人的蘑菇还在变多：2025 年鉴定出 <strong>138 种</strong>，其中 <strong>34 种</strong>是国内首次记录。「祖祖辈辈都这么吃」这句话，可能已经过期。</p>\n<p>那些辨别法呢？银针试毒——蘑菇毒素不含硫，银针变黑靠的恰恰是硫，跟有毒没毒无关。虫子吃过就没毒——剧毒蘑菇成熟后照样被虫啃。颜色鲜艳才有毒——有没有毒和颜色无关。高温油炸能去毒——不靠谱。</p>\n<p>中国疾控中心的结论是：「目前没有简单易行、快速有效的识别蘑菇是否有毒的方法。」</p>\n<p>所以最省事的处理就是别吃。已经吃了、觉得不对劲，立即去医院，别扛着也别自己催吐，把剩下的蘑菇或照片带上——中毒分好几种类型，医生认出是哪一种才好对症。</p>", "source": "第 1 节第 5 条 · 证据 A · 中国疾控中心 China CDC Weekly (2026)", "file": "001-hl-野生蘑菇.md"}, {"title": "比熬夜更伤的是：今晚一点睡，周末中午起", "html": "<p>室友的作息表是这样的：周一到周五凌晨一点半睡、七点半起，周末补到中午十一点。</p>\n<p>他觉得自己没熬夜——工作日欠的觉，周末一次性还清了。</p>\n<p>但身体不这么算。英国生物银行跟踪了约 6.1 万个戴腕表的人，按作息规律程度分成五档。较规律的那四档，比最不规律的那一档，死亡风险低 <strong>20% 到 48%</strong>。研究结论很直接：<strong>作息规不规律，比睡多久更能预测死亡</strong>。</p>\n<p>还有一项追踪了 51,562 人的研究，记录睡眠时刻后发现：工作日和周末的睡眠中点如果差到 <strong>2 小时以上</strong>——这叫「社会时差」——心血管病风险高约 <strong>30%</strong>。哪怕每天睡够 7 小时，这个关联照样存在。</p>\n<p>那到底睡几个小时？16 项跟踪研究合起来算，138 万人、11.3 万例死亡，结论是：<strong>7 小时那一档风险最低</strong>。少于 7 小时，每少 1 小时风险高约 6%；多于 7 小时，每多 1 小时高约 13%。</p>\n<p>这里有个容易搞反的地方：睡得长的人风险高，多半是因果颠倒了——是抑郁、慢性病、睡眠呼吸暂停让人睡得多，不是睡得多让人生病。<strong>没有人建议你少睡。</strong></p>\n<p>所以真正要改的只有两件：睡够 7 小时，把上床和起床的点固定住。</p>\n<p>不是要你早睡，是要你<strong>别在几个时区之间来回跳</strong>——周五两点、周日两点、周一十一点，身体每一次都要重调。</p>", "source": "第 2 节第 13 条 · 证据 A（作息部分单独看为 B）· Cappuccio 等 (2010) Sleep 汇总分析", "file": "002-hl-睡够七小时.md"}, {"title": "电梯等在那儿，你走楼梯上去——每天攒够四分钟就够", "html": "<p>下课回宿舍，电梯口排了七八个人。楼梯就在旁边，四层，你犹豫了三秒，还是站进队伍里。</p>\n<p>「反正也不差这一分钟。」</p>\n<p>英国生物银行跟踪了 2.52 万个平时完全不锻炼的人，平均 6.9 年，其中 852 人去世。研究里有一批人，每天有 3 次、每次 1–2 分钟的<strong>零碎剧烈活动</strong>——爬楼梯、快走赶路这种，不换衣服、不去健身房，就嵌在生活里。和完全没有的人比：</p>\n<p>- 死亡风险、癌症死亡风险降低 <strong>38%–40%</strong><br>- 心血管死亡风险降低 <strong>48%–49%</strong></p>\n<p>每天这类活动累计到 <strong>4.4 分钟</strong>的人，收益小一些但仍在：死亡和癌症死亡降 26%–30%，心血管死亡降 32%–34%。</p>\n<p>注意研究对象——<strong>平时完全不锻炼的人</strong>。如果你已经有规律运动，这条对你不适用，别拿它当替代品。</p>\n<p>也得说清它的局限：这是跟踪记录，没做分组试验，只跟了 6.9 年。好处是活动量靠可穿戴设备实测，不是让人回忆填问卷，比大多数同类研究可靠。</p>\n<p>所以这条建议的成本接近零：不花钱，不占额外时间，<strong>唯一的难点是记得</strong>——电梯来了不进去，快递柜在楼下就走快两步。</p>\n<p>四分钟，不是四十分钟。你缺的从来不是时间。</p>", "source": "第 2 节第 15 条 · 证据 A · Stamatakis 等 (2022) Nature Medicine", "file": "003-hl-零碎用力.md"}], "skills": [{"title": "你现在双击的那个图标，其实就是一条命令", "html": "<p>桌面上的 Chrome 图标，双击就能打开。命令行里敲一行字，也能打开同一个东西——差别只在于：<strong>一个用鼠标指，一个用文字说</strong>。</p>\n<p>双击时系统做的事，其实是「按记录下来的路径启动这个程序」。命令行只是把这一步交给你自己写。</p>\n<p>那为什么还要用它？因为鼠标只能做一件事一次，而文字可以<strong>组合、记录、重复</strong>：把三条命令接起来一次跑完，或者存成文件明天再跑一遍。这就是命令行真正的价值——不是更酷，是<strong>能复用</strong>。</p>\n<p>Windows 上的「PowerShell」或「命令提示符」，macOS/Linux 上的「终端」，都是同一个东西的不同外壳。看到「在终端里执行」这句话，不用紧张，它只是换了个方式打开你已经会的程序。</p>\n<p><strong>今天能懂的一点</strong>：命令行不是程序员的黑话，它是「用文字操作系统」的入口，你已经在用它的图形版。</p>", "source": "技能线 001 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "001-cli-命令行是什么.md"}, {"title": "256G 的手机，开机就只剩 230G——不是厂商骗你", "html": "<p>新手机到手，包装上写着 256G。开机进设置一看，容量那一栏写着 238.4G，再扣掉系统和预装，可用的只剩 229G 左右。</p>\n<p>很多人的第一反应是「被坑了」。其实这里面没有任何欺诈，只有两套单位在打架——而这个打架的根源，和你以后看到的每一条带宽广告都有关。</p>\n<p>## 数字是怎么对不上的</p>\n<p>厂商说的 256G，是 <strong>256 × 10⁹ 字节</strong>，也就是 2560 亿个字节。这是国际单位制里的「G」，一 G 就是十亿。</p>\n<p>系统显示的，是按 <strong>1024 进制</strong>折算的。它把 2560 亿字节除以 1024 三次，得到约 <strong>238.4</strong>，然后标上 G。</p>\n<p>同样是 2560 亿字节，一个说 256，一个说 238。差的那 7%，不是被谁拿走了，是同一个数用了两把尺子。</p>\n<p>## 为什么电脑非要用 1024</p>\n<p>这才是关键。如果只是「单位不统一」，改成统一的不就完了？改不了，因为<strong>计算机的容量天生就是 2 的幂</strong>。</p>\n<p>想想内存怎么存一个数：一根存储单元只能表示两种状态，有电或没电。这是一个比特。八根并排就是 256 种组合，够表示一个字节的全部取值。根本不需要别的进制——它就是二进制的物理实体。</p>\n<p>既然地址是按二进制编的，容量自然就长成 1、2、4、8、16、32、256、512 这样的数。你不可能买到一根「1000 个单元」的内存条，它要么是 1024，要么是 2048。</p>\n<p>于是「1024 是一千」成了这个圈子的习惯，久了就有了专门的写法：1024 进制叫 <strong>GiB</strong>，十进制叫 <strong>GB</strong>。硬盘厂按 GB 卖，操作系统按 GiB 显示，两套并行了几十年。</p>\n<p>## 这个知识有什么用</p>\n<p>它不是一个冷知识，它是一把尺子。你以后会反复用到它：</p>\n<p><strong>宽带。</strong> 办 100M 宽带，下载速度显示 12.5MB/s。不是运营商缺斤少两——这里的 M 是<strong>比特</strong>，那里的是<strong>字节</strong>，一个字节等于八个比特。100 ÷ 8 = 12.5。看懂这一条，可以少打很多客服电话。</p>\n<p><strong>内存与显存。</strong> 为什么内存条总是 8G、16G、32G，从不出现 10G？同理，它是按二进制长出来的，不是按你的喜好。</p>\n<p><strong>存储卡。</strong> 标 128G 的卡，实际写入大约 119GiB。也是这个换算。</p>\n<p>## 一条边界</p>\n<p>这套解释只适用于「容量为什么对不上」。<strong>系统占掉的那几十个 G 是真占</strong>——预装应用、恢复分区、文件系统本身的索引，这些确实是硬件之外的开销。两部分原因叠在一起，才有了「256 变 229」这个结果。</p>\n<p>## 留给你的问题</p>\n<p>既然存储是二进制的、容量总是 2 的幂，那<strong>为什么硬盘厂不干脆按 1024 卖，省得大家误会？</strong></p>\n<p>（答案下周周报里说。你也可以先自己想一想：一台标着 1TB 的硬盘，如果真按 1024 进制做，成本会高多少？）</p>", "source": "概念 002 · 二进制与容量单位 · 数据来源：IEC 80000-13 单位标准", "file": "002-概念-256G为什么变230G.md"}, {"title": "电脑越用越慢，到底慢在哪一步", "html": "<p>新买的电脑很快，一年后开始卡。你重装系统，又快了；再过一年，又慢了。</p>\n<p>如果\"重装能解决\"，说明问题不在硬件——那到底发生了什么？</p>\n<p>## 一台电脑只有三样东西在配合</p>\n<p>打开任何一个程序，实际上是这三样在轮流干活：</p>\n<p>| 部件 | 干什么 | 速度量级 |<br>|---|---|---|<br>| <strong>CPU</strong> | 算 | 纳秒（十亿分之一秒） |<br>| <strong>内存</strong> | 临时放正在用的东西 | 几十纳秒 |<br>| <strong>硬盘</strong> | 长期存东西 | 微秒到毫秒（慢一千倍以上） |</p>\n<p>关键在这里：<strong>硬盘比内存慢几百到上千倍</strong>。</p>\n<p>所以整个计算机体系里最贵的一件事，就是\"等硬盘\"。</p>\n<p>## 变慢的机制：缓存失效</p>\n<p>系统会把常用的东西放进内存里（这叫缓存）。用久了之后：</p>\n<p>1. 你装了更多软件，开机时要加载的东西变多<br>2. 后台自启动的程序越来越多<br>3. 硬盘里的碎片、日志、临时文件堆积<br>4. <strong>硬盘本身的读取速度会随使用下降</strong>（尤其是机械硬盘，以及写满之后的固态硬盘）</p>\n<p>重装系统之所以有效，就是把 1、2、3 一次性清空，让缓存重新变干净。</p>\n<p>## 为什么固态硬盘也会越用越慢</p>\n<p>这一条反直觉。固态硬盘（SSD）写数据前必须先擦除，而擦除的最小单位比写入大得多。写满之后，每次写入都要先搬数据，速度就掉下来。</p>\n<p>所以 SSD 有一个\"剩余空间够多才快\"的特性。<strong>保持 20% 以上空闲</strong>，比任何优化软件都管用。</p>\n<p>## 一条边界</p>\n<p>不是所有卡顿都是这个原因。</p>\n<p>如果电脑用了三四年、风扇狂转、开机就烫，那可能是散热问题——CPU 过热会自动降频。这种情况清理灰尘、换硅脂比重装系统有效。</p>\n<p>另外，内存不够（比如 8G 跑现代浏览器）也会卡，而这条重装是解决不了的。</p>\n<p>## 今天可以做的</p>\n<p>下次觉得卡，先分清是哪一种：</p>\n<p>- <strong>开机慢、程序启动慢</strong> → 是硬盘和自启动（关掉不必要的自启动）<br>- <strong>同时开很多东西才卡</strong> → 是内存不够（加内存）<br>- <strong>一直烫、风扇响</strong> → 是散热（清灰换硅脂）<br>- <strong>用着用着突然卡住几秒</strong> → 可能是硬盘快满了</p>\n<p>四个原因，四种解法。重装系统只能解决第一种的一半。</p>", "source": "常识 · 概念 003 · 存储层次与缓存", "file": "003-概念-电脑为什么越用越慢.md"}, {"title": "什么是 API：两个程序之间怎么说话", "html": "<p>你在手机上点\"查看天气\"，屏幕上就出现了温度、湿度、明天的预报。</p>\n<p>温度不是手机测的，是气象服务商的数据。<strong>手机怎么拿到它？</strong> 中间那一步，就是 API。</p>\n<p>## API 是什么</p>\n<p>API 全称是应用程序接口。你可以把它理解成<strong>一份约定好的点菜方式</strong>：</p>\n<p>- 我做了一个服务，它能回答「北京今天几度」<br>- 我把\"怎么问\"写下来：发一个请求，地址是 `…/weather?city=beijing`，格式是 JSON<br>- 任何人照这个格式发过来，我就返回数据</p>\n<p><strong>API 就是这份\"怎么问\"的说明书。</strong></p>\n<p>## 为什么需要它</p>\n<p>因为程序之间不能\"聊一句\"，只能严格按格式交换。</p>\n<p>如果每个调用方都用自己的格式，服务端就要为每个人写一套解析——五个应用五种写法，维护成本爆炸。</p>\n<p>API 把这个成本压到一次：<strong>定义一次格式，所有人照着来</strong>。</p>\n<p>这套约定里通常包含三件事：</p>\n<p>1. <strong>地址</strong>：问谁<br>2. <strong>参数</strong>：问什么（城市、日期、单位）<br>3. <strong>返回格式</strong>：怎么答（JSON，字段名固定）</p>\n<p>## 一个你天天在用的例子</p>\n<p>你在手机上用微信登录某个小网站，选\"用微信登录\"，然后授权——这个过程里，那个网站就是在调用微信的 API：请告诉我这个人是谁，并且获取他的昵称和头像。</p>\n<p>网站拿不到你的密码，只能拿到微信同意给出的那部分信息。<strong>这就是 API 权限的意义：按约定给，不多给。</strong></p>\n<p>## 一条边界</p>\n<p>API 不等于免费公开。</p>\n<p>绝大多数 API 需要密钥（key），有的还按调用次数收费，有的限制每分钟能问几次。你看到的\"免费天气 API\"，通常有每天几百次的额度。</p>\n<p>## 今天可以做的</p>\n<p>下次看到某个工具说\"支持 API\"，你就知道它意味着：<strong>这个工具可以被别的程序自动调用，而不只是人在界面上点。</strong></p>\n<p>这就是为什么很多软件加上 API 之后，能接进一整个生态——因为它从\"一个网站\"变成了\"一块可以拼的零件\"。</p>", "source": "常识 · 概念 004 · 接口与协议", "file": "004-概念-API是什么.md"}, {"title": "什么是算法：同样一件事，两种做法差一百倍", "html": "<p>你在通讯录里找一个名字，怎么找？</p>\n<p>打开通讯录，从第一个开始往下看，看到为止。这是<strong>顺序查找</strong>。</p>\n<p>如果通讯录有 1000 个人，平均要看 500 次。如果有一百万人，平均要看五十万次。</p>\n<p>换一种做法：通讯录是按拼音排序的。你先翻到中间，看这个字比目标大还是小，然后只保留一半，再对半……每翻一次，范围减半。</p>\n<p>一百万人，最多翻 <strong>20 次</strong>。</p>\n<p><strong>这就是算法的全部意义：不是让计算机更努力，是让它少干无用功。</strong></p>\n<p>## 一句话定义</p>\n<p>算法 = <strong>解决问题的有限个步骤</strong>。</p>\n<p>注意三个词：解决问题（有目标）、有限（会结束）、步骤（可重复执行）。缺一个都不算算法。</p>\n<p>\"一直试到成功为止\"不是算法，因为它可能不结束。</p>\n<p>## 为什么差距这么大</p>\n<p>关键在<strong>增长的速度</strong>。</p>\n<p>| 数据量 | 顺序查找（最坏） | 对半查找（最坏） |<br>|---|---|---|<br>| 1,000 | 1,000 次 | 10 次 |<br>| 100 万 | 100 万次 | 20 次 |<br>| 10 亿 | 10 亿次 | 30 次 |</p>\n<p>数据量翻一千倍，顺序查找的工作量也翻一千倍；对半查找只多 10 次。</p>\n<p>这个\"翻倍时工作量怎么变\"的性质，就是算法里说的复杂度。<strong>它描述的不是快慢，是变慢的速度。</strong></p>\n<p>## 一个前提条件</p>\n<p>对半查找能成立，是因为<strong>通讯录是排好序的</strong>。排序本身的成本不低（一百万条大概要几秒）。</p>\n<p>所以：</p>\n<p>- 只查一次 → 排序不划算，老实顺序查<br>- 要查一万次 → 先花几秒排序，后面每次都省几十万次</p>\n<p><strong>算法的选择取决于使用场景，没有绝对最好的算法。</strong></p>\n<p>## 一条边界</p>\n<p>不是所有问题都有\"快\"的解法。</p>\n<p>有些问题在数学上被证明不存在高效解法（比如某些加密破解问题）。这类问题的价值恰恰在于\"没有快解法\"——你的密码安全就建立在这上面。</p>\n<p>## 今天可以做的</p>\n<p>下次觉得某个操作\"很慢\"，别急着升级硬件，先问一句：<strong>我是不是在用最笨的方法做它？</strong></p>\n<p>很多时候，换一个做法比换一台电脑有用得多。</p>", "source": "常识 · 概念 005 · 算法与复杂度", "file": "005-概念-什么是算法.md"}, {"title": "为什么负数要用「补码」表示", "html": "<p>计算机只会加法。</p>\n<p>它没有专门的减法电路——<strong>减法是用加法做出来的</strong>。</p>\n<p>这件事听起来像魔术，实现它的就是补码。</p>\n<p>## 先说一个日常的类比</p>\n<p>假设一个时钟只有 0 到 11 共 12 个小时。现在指着 3 点，你想调到 1 点：</p>\n<p>- 往前走 10 小时（3 + 10 = 13，超过 12 就从 1 开始，落在 1）<br>- 或者往后退 2 小时（3 - 2 = 1）</p>\n<p><strong>减 2 和加 10，在这个只有 12 个格子的系统里，是同一件事。</strong></p>\n<p>因为 10 = 12 - 2。这个 10，就叫 -2 的\"补数\"。</p>\n<p>## 计算机里的 8 位例子</p>\n<p>一个 8 位的数，能表示 0 到 255（共 256 个值）。超过 255 就\"溢出\"，回到 0。</p>\n<p>在这个系统里，-1 可以写成 255 的等价物：</p>\n<p>```<br>  1 = 0000 0001<br> -1 = 1111 1111   （也就是十进制的 255）<br>```</p>\n<p>验证一下：`1 + (-1)` 用二进制算：</p>\n<p>```<br>  0000 0001<br>+ 1111 1111<br>-----------<br>1 0000 0000   ← 第 9 位溢出被丢掉，结果正好是 0<br>```</p>\n<p><strong>减 1 变成了加 255，结果正确。</strong> 计算机只需要一套加法电路，就能同时算加减。</p>\n<p>## 代价是什么</p>\n<p>一半的取值空间给了负数。</p>\n<p>8 位如果只存正数，能到 255；用了补码之后，范围变成 <strong>-128 到 +127</strong>。</p>\n<p>这就是为什么 `int`（32 位）的范围是 -2147483648 到 2147483647——<strong>正数比负数的绝对值少一个</strong>，因为 0 占了一个位置。</p>\n<p>## 顺带解释两个怪现象</p>\n<p><strong>为什么 `-(-128)` 还是 -128？</strong> 因为 128 超出了 8 位补码的最大值 127，取反加一之后又绕回来了。</p>\n<p><strong>为什么要区分有符号和无符号？</strong> 同样一串 `1111 1111`，按无符号读是 255，按有符号读是 -1。<strong>同一份数据，两种解释。</strong></p>\n<p>## 一条边界</p>\n<p>补码不是数学上唯一的方案。历史上还有\"反码\"和\"原码\"，但它们有两个问题：-0 和 +0 两个零、减法要额外判断符号。</p>\n<p>补码胜出，是因为它把所有情况统一成了一次加法。</p>\n<p>## 今天可以做的</p>\n<p>如果你学过 C 语言的位运算，试一下：</p>\n<p>```c<br>int a = -1;<br>printf(\"%u\\n\", a);   // 输出 4294967295<br>```</p>\n<p>`-1` 在内存里就是一串全 1。按有符号读是 -1，按无符号读是 32 个 1 组成的最大值。</p>", "source": "常识 · 概念 006 · 二进制与有符号数", "file": "006-概念-补码.md"}, {"title": "什么是编译器：你写的那几十行字，怎么变成能跑的程序", "html": "<p>你在记事本里写了一段 C 代码，保存成 `.c` 文件。</p>\n<p>双击它——什么都不会发生。因为<strong>文本文件对 CPU 来说毫无意义</strong>。</p>\n<p>中间那一步，就是编译器干的活。</p>\n<p>## 三样东西，三种语言</p>\n<p>| 阶段 | 语言 | 谁听得懂 |<br>|---|---|---|<br>| 你写的 | C / C++ / Python | 人 |<br>| 编译后 | 机器指令（0 和 1） | CPU |<br>| 中间 | 汇编 | 少数人 |</p>\n<p>编译器就是<strong>翻译</strong>。但它不是逐句翻译，而是先整体理解，再重新组织——这也是它能做优化的原因。</p>\n<p>## 它其实分了四步</p>\n<p>大多数人以为是\"一步编译完\"，实际是四个阶段：</p>\n<p>1. <strong>预处理</strong>：处理 `#include`、`#define`，把你的代码和头文件拼成一个大文件<br>2. <strong>编译</strong>：把 C 代码翻译成汇编（还只是文本，不是二进制）<br>3. <strong>汇编</strong>：把汇编翻译成机器码（.o 目标文件，仍然不能直接跑）<br>4. <strong>链接</strong>：把多个 .o 和库拼成最终的可执行文件</p>\n<p>第二步叫\"编译\"，但整个流程叫\"构建\"。<strong>你说\"编译报错\"时，错可能出在任何一步</strong>——比如\"undefined reference\"就是链接错误，不是语法错误。</p>\n<p>## 为什么 C 必须编译，Python 不用</p>\n<p>C 是<strong>编译型</strong>：运行前一次性翻译成机器码，运行时直接执行机器指令。</p>\n<p>Python 是<strong>解释型</strong>：运行时由解释器一行一行地读、一行一行地执行。</p>\n<p>代价很直观：</p>\n<p>| | C | Python |<br>|---|---|---|<br>| 运行速度 | 快（直接执行机器码） | 慢（每行都要解释） |<br>| 换平台 | 必须重新编译 | 一般不用 |<br>| 出错时机 | 编译期就能发现很多 | 只有运行到那一行才知道 |</p>\n<p>这也解释了为什么 Python 写起来轻松、跑起来慢——<strong>它是用运行时开销换开发速度</strong>。</p>\n<p>## 一条边界</p>\n<p>\"编译型更快\"不是绝对的。</p>\n<p>现代 Python 有 JIT、C 有解释器（比如 TCC 边写边跑）。而且程序快不快，主要取决于算法和数据量，不是语言——用 Python 写的对半查找，照样比 C 写的冒泡排序快。</p>\n<p><strong>语言决定的是常数倍，算法决定的是数量级。</strong></p>\n<p>## 今天可以做的</p>\n<p>如果你写过 C，下次编译时把 `gcc main.c -o main` 拆开试一次：</p>\n<p>```<br>gcc -E main.c -o main.i     # 只看预处理结果<br>gcc -S main.i -o main.s     # 生成汇编<br>gcc -c main.s -o main.o     # 生成目标文件<br>gcc main.o -o main          # 链接<br>```</p>\n<p>四步跑完，你会看到 `.i` 文件大得吓人——那是头文件全被展开的结果。</p>", "source": "常识 · 概念 007 · 编译与链接", "file": "007-概念-什么是编译器.md"}, {"title": "什么是缓存：同一个东西，为什么第二次打开就快了", "html": "<p>第一次打开某个网页要等三秒，第二次几乎瞬间出现。</p>\n<p>你没换网，服务器也没变快。变的是<strong>东西已经在你这边了</strong>。</p>\n<p>## 缓存一句话</p>\n<p><strong>把计算结果存到更近、更快的地方，下次直接用。</strong></p>\n<p>它是计算机里最普遍的思想，没有之一——CPU 里有缓存、硬盘有缓存、浏览器有缓存、DNS 有缓存、你脑子里也有。</p>\n<p>## 为什么它值得存在</p>\n<p>因为访问不同存储的代价差几个数量级：</p>\n<p>| 存储 | 大约耗时 |<br>|---|---|<br>| CPU 寄存器 | 亚纳秒 |<br>| 内存 | 几十纳秒 |<br>| 固态硬盘 | 几十微秒 |<br>| 网络请求 | 几十毫秒到几秒 |</p>\n<p>从网络拿一次数据的时间，够 CPU 算几百万次。</p>\n<p>所以只要有一件事被反复用到，把它搬到更近的地方就赚了。</p>\n<p>## 关键问题：什么时候该扔掉</p>\n<p>缓存真正的难点不是\"存\"，是\"什么时候不信任它\"。</p>\n<p>如果网页更新了，而你的浏览器还在用旧缓存，你会看到过期内容。如果数据库改了，而系统还在用缓存，用户会看到错误数据。</p>\n<p>所以每个缓存都要回答一个问题：<strong>多久之后失效？</strong></p>\n<p>三种常见策略：</p>\n<p>1. <strong>定时过期</strong>：存 5 分钟，之后重新拉<br>2. <strong>主动通知</strong>：数据一变就告诉缓存\"作废\"<br>3. <strong>对比版本</strong>：每次先问\"还是那一版吗\"，是就用缓存</p>\n<p>选哪个，取决于你能容忍多旧的数据。<strong>股票行情容忍一秒，天气预报容忍一小时。</strong></p>\n<p>## 一条边界</p>\n<p>缓存不能解决所有慢。</p>\n<p>如果每次请求的数据都不一样（比如每次搜索的关键词都不同），缓存命中率接近零，加了也没用。</p>\n<p>另外缓存会让\"第一次慢\"永远存在——它优化的是重复，不是首次。</p>\n<p>## 今天可以做的</p>\n<p>下次觉得某个操作\"第一次慢、之后快\"，你就知道那是缓存在起作用。</p>\n<p>反过来，如果你更新了什么却发现看不到变化——<strong>先怀疑缓存</strong>，这能省掉大量\"是不是服务器坏了\"的排查。</p>", "source": "常识 · 概念 008 · 缓存与存储层次", "file": "008-概念-缓存.md"}], "weekly": [{"title": "第 1 期 · 你其实每天只需要四分钟", "html": "<p>这是第一份周报。往后每周六早上，它会把这一周的东西串起来，再给你一个三十分钟内能做完的动作。</p>\n<p>## 本周的六篇，其实在讲同一件事</p>\n<p><strong>书线两篇</strong>：蘑菇那篇讲「没有可靠的鉴别方法，那就别赌」；睡眠那篇讲「作息规律比睡多久更要命」；今天这篇讲「每天四分钟的零碎用力就够」。</p>\n<p>拼起来是同一个判断方式：<strong>先找那条最省力的边界，再决定要不要越过它</strong>。不吃野蘑菇是省力的，固定起床时间是省力的，走楼梯是省力的——它们都不要求你变成一个更自律的人。</p>\n<p><strong>技能线两篇</strong>：命令行到底是什么、路径为什么找不到文件。这两篇没有让你立刻去做任何事，它们在做另一件事：<strong>把你每天点的图标，还原成程序和数据</strong>。</p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：让命令行第一次替你干活，而不是听你描述它。</p>\n<p>1. 按 `Win+R`，输入 `powershell`，回车（5 分钟，包括翻出这个窗口）<br>2. 敲 `cd $HOME`，回车——你会「走」到自己的用户目录<br>3. 敲 `dir`，回车——看看里面有什么，和你在资源管理器里看到的是不是同一批东西<br>4. 挑一个文件夹，`cd 它的名字`，再 `dir` 一次<br>5. 敲 `cd ..` 退回来，重复两三次</p>\n<p><strong>做完的标准</strong>：你能不看提示，说出「我现在在哪」和「怎么回上一层」。</p>\n<p>做不到也没关系——下周的技能稿会接着讲。这一步的全部意义是：让「命令行」从一个名词变成一个你摸过的东西。</p>\n<p>## 本周深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| （本周没有） | — |</p>\n<p>第一篇长文随时可以找我要，主题由你选或者我推荐。读完再要下一篇。</p>", "source": "周报第 1 期 · 2026-11-02 至 2026-11-07", "file": "001-第1期.md"}, {"title": "第 2 期 · 你判断一段话是否可信，只需要四个问题", "html": "<p>这周的六篇其实在讲同一件事：<strong>别人怎么说服你，以及你怎么不被说服。</strong></p>\n<p>## 本周都讲了什么</p>\n<p><strong>书线三篇</strong>（都来自《学会提问》）：</p>\n<p>- <strong>专家替代不了你</strong>——你复述结论时，通常没带上依据<br>- <strong>海绵式与淘金式</strong>——接收信息和提问，可以同时进行<br>- <strong>强势批判</strong>——这套方法用来检查自己，比用来反驳别人难也值钱</p>\n<p><strong>常识线两篇</strong>：</p>\n<p>- <strong>电脑为什么越慢</strong>——CPU / 内存 / 硬盘三者的速度差，决定了瓶颈在哪<br>- <strong>什么是 API</strong>——程序之间按约定交换数据，而不是\"聊一句\"</p>\n<p>这两条线看着不搭，其实贴着：<strong>一个是识别信息质量，一个是理解系统怎么运转。</strong></p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：把本周的方法真正用一次。</p>\n<p>挑一条你今天看到的、让你有点动摇的说法（广告、新闻、同学的推荐都行）。不要搜资料，只用四个问题过一遍：</p>\n<p>1. 他到底想让我相信什么？（一句话写下来）<br>2. 他凭什么？（把理由列出来，不超过三条）<br>3. 哪一部分我最可能误解？（圈出一个词）<br>4. 有什么他没说？（至少写一条）</p>\n<p><strong>做完的标准</strong>：你能用三句话向别人复述这条信息的可靠程度，而不是只能复述内容。</p>\n<p>## 本周闭卷自测</p>\n<p><strong>不要查资料，先自己想，答案下周给。</strong></p>\n<p>1. 「某地发生事故，5 人死亡」和「全球每年交通事故死亡约 119 万人」，为什么前者更让你难受？<br>2. 「发达国家 / 发展中国家」这个二分法，最大的问题是什么？<br>3. 电脑开机变慢、但用起来还不卡，最先该怀疑哪个部件？<br>4. 一个 API 至少要约定清楚哪三件事？<br>5. 为什么「批判性思维」用来检查自己比用来反驳别人更有价值？</p>\n<p>答不上来不用慌——<strong>答不上来的那一条，就是你这周真正需要重读的。</strong></p>\n<p>## 深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| 001 你每天收到的那条推送，是怎么跑到你手机里的 | 11-05 已通知 |<br>| 002 网站存的不是你密码，是你密码的指纹 | 11-07 已通知 |<br>| 003 平均数会骗人：三个数字陷阱 | 11-09 已通知 |</p>", "source": "周报第 2 期 · 2026-11-09 至 2026-11-14", "file": "002-第2期.md"}, {"title": "第 3 期 · 你看到的曲线，可能只是整条 S 的最陡一段", "html": "<p>这周的四篇在讲两件事：<strong>怎么判断趋势</strong>，以及<strong>怎么判断一本书值不值得读</strong>。</p>\n<p>## 本周都讲了什么</p>\n<p><strong>书线两篇</strong>：</p>\n<p>- <strong>直线思维</strong>——人看到两个点就会连成直线，但真实世界多是 S 形、钟形、趋平<br>- <strong>阅读的三个层次</strong>——速读判断值不值得读、精读弄懂一个论点、主题阅读解决一个问题</p>\n<p><strong>常识线两篇</strong>：</p>\n<p>- <strong>什么是算法</strong>——同样一件事，换个做法能差几万倍；关键是「数据翻倍时工作量怎么变」<br>- <strong>为什么负数用补码</strong>——计算机只会加法，减法是靠\"加一个绕回来的数\"实现的</p>\n<p>线是这么串起来的：<strong>判断趋势需要数据，而读书是获取数据的入口；算法和补码则是「计算机为什么这样运转」的两块地基。</strong></p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：把「速读」真正用一次。</p>\n<p>挑一本你买来但没读完的书，定 20 分钟闹钟，只做四件事：</p>\n<p>1. 读目录，圈出最相关的两章<br>2. 读序言，用一句话写下作者说自己要解决什么问题<br>3. 每章只读开头和结尾各一段<br>4. 合上书，回答：<strong>这本书里值得精读的是哪一章？为什么</strong></p>\n<p><strong>做完的标准</strong>：你能说出\"我暂时不读这本书，因为______\"——这也是一个好答案。</p>\n<p>## 本周闭卷自测</p>\n<p><strong>不查资料，先自己想。</strong></p>\n<p>1. 有人说「照这个速度，三年后就是十倍」，你最该问的一句话是什么？<br>2. 一本书 300 页，速读阶段你只读哪几部分？<br>3. 在一百万条数据里找一个值，顺序查找和对半查找各要多少次？为什么差这么多？<br>4. 8 位补码能表示的整数范围是多少？为什么负数比正数多一个？<br>5. 主题阅读的产出是什么？（提示：不是\"读了五本书\"）</p>\n<p>## 深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| 001 你每天收到的那条推送，是怎么跑到你手机里的 | 11-05 |<br>| 002 网站存的不是你密码，是你密码的指纹 | 11-07 |<br>| 003 平均数会骗人：三个数字陷阱 | 11-09 |</p>", "source": "周报第 3 期 · 2026-11-16 至 2026-11-21", "file": "003-第3期.md"}, {"title": "第 4 期 · 你怕的东西，和真正危险的东西不是一回事", "html": "<p>本周六篇围绕一个共同的问题：<strong>你的直觉什么时候可靠，什么时候不可靠。</strong></p>\n<p>## 本周都讲了什么</p>\n<p><strong>书线三篇</strong>：</p>\n<p>- <strong>阅读的三个层次</strong>——速读判断值不值得读、精读弄懂一个论点、主题阅读解决一个问题<br>- <strong>恐惧本能</strong>——恐惧被「有画面、突发、有活物」触发，而现代主要死因全是缓慢无画面的<br>- <strong>思考的障碍</strong>——太快下结论、刻板印象代劳、一次只装一件事</p>\n<p><strong>常识线两篇</strong>：</p>\n<p>- <strong>什么是编译器</strong>——预处理、编译、汇编、链接四步走，为什么 C 快 Python 慢<br>- <strong>什么是缓存</strong>——把常用的东西搬到更近的地方，难点是「什么时候该扔掉」</p>\n<p>串起来是一条线：<strong>人的直觉在原始环境里很准，在现代环境里经常错位；而计算机的设计，处处在替这种不可靠兜底（缓存是替代记忆，编译器是替代翻译）。</strong></p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：把自己\"怕的东西\"和\"真正的风险\"对齐一次。</p>\n<p>1. 写下三件你最近确实害怕的事（不要写新闻里的，写你自己的）<br>2. 每件后面写：它一年发生几次？在你这年龄段、你这环境里概率大概多少？<br>3. 再写三件你<strong>不怕</strong>、但每年杀死很多人的事（比如久坐、熬夜、不系安全带）</p>\n<p><strong>做完的标准</strong>：你能说出自己怕的三件事里，有几件是\"因为画面\"而不是\"因为概率\"。</p>\n<p>## 本周闭卷自测</p>\n<p><strong>不查资料，先自己想。</strong></p>\n<p>1. 恐惧本能被哪四个条件触发？为什么现代主要死因很难触发它？<br>2. 编译的四个阶段分别是什么？\"undefined reference\" 属于哪一步的错误？<br>3. 缓存真正的难点是什么？列举两种失效策略。<br>4. 为什么「这本书很可靠，因为它说的都对」是循环论证？<br>5. 「减少作业量」被反驳成「你想让大家都别学了」，这叫什么？怎么识别？</p>\n<p>## 深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| 001 你每天收到的那条推送，是怎么跑到你手机里的 | 11-05 |<br>| 002 网站存的不是你密码，是你密码的指纹 | 11-07 |<br>| 003 平均数会骗人：三个数字陷阱 | 11-09 |</p>", "source": "周报第 4 期 · 2026-11-23 至 2026-11-28", "file": "004-第4期.md"}], "longform": [{"title": "你每天早上收到的那条推送，是怎么跑到你手机里的", "html": "<p>早上九点，手机响了一下，微信里出现一段文字。你点开读两分钟，然后关掉。</p>\n<p>这件事看起来平淡，但中间其实经过了<strong>四台不同的机器、三个不同的公司</strong>。这篇文章把这四步拆开给你看——因为只要看懂一次，你对「互联网怎么运作」的直觉就建立了一半。</p>\n<p>## 一、起点：一个文本文件</p>\n<p>那篇文章，本质上一个纯文本文件，存在我电脑的一个文件夹里。文件名像这样：</p>\n<p>```<br>articles/books/003-hl-零碎用力.md<br>```</p>\n<p>`articles` 是文件夹，`books` 是栏目，后面是文件名。<strong>它的全部内容就是几百个汉字</strong>，加上第一行的标题和最后一行的小字出处。</p>\n<p>没有数据库，没有页面，就是一个 `.md` 文件。</p>\n<p>## 二、第一跳：文件被送到 GitHub</p>\n<p>我改完文件后，敲一条命令，文件被「推」到 GitHub 上的一个仓库里。</p>\n<p>GitHub 是一家美国的代码托管公司。它给你三样东西：<strong>存文件的地方、版本历史、以及一台能替你跑程序的服务器</strong>。</p>\n<p>第三样最关键。它意味着——<strong>我的电脑可以关机，程序照样有人跑</strong>。</p>\n<p>## 三、第二跳：定时器叫醒了程序</p>\n<p>GitHub 里有一条配置，长这样：</p>\n<p>```yaml<br>on:<br>  schedule:<br>    - cron: \"0 1 * * *\"<br>```</p>\n<p>这行 `cron` 的意思是「每天 01:00（UTC）」。UTC 比北京时间晚 8 小时，所以它对应的是<strong>北京时间早上 9 点</strong>。</p>\n<p>这里有个常见的误会：<strong>没有人在等这行代码执行</strong>。GitHub 的调度器每分钟扫一次所有仓库的排期表，到点了就把那台虚拟服务器叫醒，跑一遍脚本，然后关掉。</p>\n<p>所以你收到的不是「有人按了发送」，而是「一台机器按时开了机」。</p>\n<p>## 四、第三跳：脚本把文件变成消息</p>\n<p>被叫醒的那台机器上，跑的是我写的一个 Python 脚本。它干四件事：</p>\n<p>1. 看看今天是几号、星期几<br>2. 按排期决定今天该发哪个栏目<br>3. 从栏目文件夹里按顺序取出一篇<br>4. 把正文转成一条消息，发给 Server酱</p>\n<p>第 4 步值得多说一句。那篇文章是 Markdown 格式（`<strong>加粗</strong>`、空行分段），而微信要的是渲染好的文本。所以脚本会把 Markdown 转成带格式的字符串，再把最后一行的出处变成斜体小字。</p>\n<p><strong>你看到的每条消息，都是在这一刻被「翻译」出来的</strong>，不是原文。</p>\n<p>## 五、第四跳：Server酱把它塞进微信</p>\n<p>Server酱是一个国内的小服务，作用是<strong>中转</strong>。我给它一个密钥和一段文字，它就通过微信服务号把消息送到关注者的手机上。</p>\n<p>为什么要它？因为微信不开放「任何人给你发消息」的能力。只有认证过的服务号能发，而且要走微信的模板消息通道。Server酱做的就是替无数个人开发者跑完这套手续。</p>\n<p>它的免费额度是<strong>每天 5 条</strong>——这也是为什么这套系统每天只发两条，且要盯着别超。</p>\n<p>## 六、为什么会延迟</p>\n<p>你可能会发现，说好的 9 点，有时 9 点零六分才到。原因有层：</p>\n<p><strong>第一层是调度延迟。</strong> GitHub 自己的文档就写着，定时任务不保证准点，高峰期可能推迟几十分钟。它在排队。</p>\n<p><strong>第二层是运行时间。</strong> 服务器从冷启动到跑完脚本，通常十几秒。</p>\n<p><strong>第三层是投递。</strong> Server酱 → 微信服务号 → 你的手机，中间还要过推送通道。</p>\n<p>所以「9 点整」从一开始就不是承诺，是<strong>大概</strong>。</p>\n<p>## 七、失败长什么样</p>\n<p>这套系统最危险的地方，是它<strong>失败的时候可能看起来像成功</strong>。</p>\n<p>比如稿件用完了：脚本不会报错，它会安静地发一条「稿件已用完」。比如某天限额超了：消息根本发不出去，但调度器只关心「程序有没有崩溃」，没崩溃就显示绿色的对勾。</p>\n<p><strong>绿色对勾只代表脚本跑完了，不代表消息到了你手上。</strong> 这是所有自动化系统共有的盲区——它监控的是过程，不是结果。</p>\n<p>所以我给这套东西加了三道保险：库存预警、失败告警、以及一个「断更」提示。它们的作用不是让系统更可靠，而是<strong>让故障显形</strong>。</p>\n<p>## 八、这条链路的一般规律</p>\n<p>把这个例子推广开：<strong>任何「自动送达」的系统，都只有三样东西。</strong></p>\n<p>| 环节 | 这里的实现 | 换成别的场景 |<br>|---|---|---|<br>| <strong>存储</strong> | GitHub 仓库里的 md 文件 | 数据库、网盘、邮件附件 |<br>| <strong>触发</strong> | cron 定时器 | 用户点击、别人发消息、传感器报警 |<br>| <strong>投递</strong> | Server酱 → 微信 | 短信网关、邮件服务器、推送 SDK |</p>\n<p>你手机上每一个「自动」发生的事情——外卖状态更新、银行扣款提醒、课程表通知——背后都是这三样东西在接力。</p>\n<p>看懂一次，以后遇到任何「为什么我没收到」，你都知道该从哪一环开始查：是内容没生成？是触发没发生？还是投递被拦了？</p>\n<p>## 你现在就能验证</p>\n<p>如果你用的是安卓手机，打开微信里那条推送，长按它，看看有没有「查看来源」之类的选项。你会看到一条来自「服务号」的消息记录。</p>\n<p>再打开浏览器访问 `github.com/easyriver1/daily-life`，看那个仓库的 `Actions` 标签页——那里有每一次运行的记录，包括什么时候被叫醒、跑了多少秒、成功还是失败。</p>\n<p><strong>这两处加起来，就是这条链路的全部真相。</strong></p>", "source": "长文 001 · 基于本项目真实运行链路，可对照 GitHub 仓库的 Actions 记录验证", "file": "001-推送是怎么到手机的.md"}, {"title": "网站存的不是你密码，是你密码的指纹", "html": "<p>每隔一阵就有新闻：某网站被拖库，几百万条账号密码流出。</p>\n<p>然后大部分人的第一反应是「改密码」。但更好的问题是：<strong>一个正经的网站，凭什么能验证你输对了密码，却不知道你的密码是什么？</strong></p>\n<p>如果你能想明白这件事，你对「密码安全」的理解就超过大多数人。</p>\n<p>## 一、最笨也最常见的做法</p>\n<p>服务器上有一张表：</p>\n<p>| 账号 | 密码 |<br>|---|---|<br>| zhangsan | abc123 |<br>| lisi | woaini520 |</p>\n<p>你登录时，它拿你输的密码跟表里比一比，一样就放行。</p>\n<p>这个做法的问题一目了然：<strong>只要这张表泄露，所有人的密码就泄露了</strong>。而且不只是这个网站——很多人同一个密码用五个网站，一挂挂五处。</p>\n<p>这种表曾经真的很常见，而且现在仍然有。</p>\n<p>## 二、换个思路：不存密码，存指纹</p>\n<p>密码不该被「保存」，只该被「验证」。于是有人想到：能不能存一个只能验证、不能还原的东西？</p>\n<p>能。数学上这个东西叫<strong>哈希函数</strong>。</p>\n<p>它的特点是：输入任意内容，输出一串固定长度的字符；而且<strong>不可逆</strong>——给你输出，几乎不可能算出输入。</p>\n<p>比如你的密码是 `abc123`，做一次 SHA-256，得到：</p>\n<p>```<br>6ca13d52ca70c883e0f0bb101e425a89e8624de51db2d2392593af6a84118090<br>```</p>\n<p>网站存这串东西。你下次登录再输 `abc123`，它再算一遍，得到同一串，比一比，一样就放行。</p>\n<p><strong>整张表泄露也没关系</strong>——攻击者拿到的是一堆乱码，不知道原始密码是什么。</p>\n<p>## 三、但这里有个坑：猜得出来</p>\n<p>哈希不可逆，这句话成立的前提是「暴力破解算不过来」。可惜，<strong>常见密码的攻击者根本不用暴力破解</strong>。</p>\n<p>因为「密码 → 哈希」这个计算是公开的、极快的。攻击者可以拿一个密码字典（几亿条常见密码），一次性全部算成哈希，做成一张对照表。这叫<strong>彩虹表</strong>。</p>\n<p>你那张泄露的表里，只要有一个 `6ca13d52...`，他查表就知道是 `abc123`。</p>\n<p>而且算一次哈希只要微秒级。今天一块普通显卡每秒能算几十亿次。</p>\n<p>## 四、加盐：让同一密码算出不同指纹</p>\n<p>解决办法很朴素：<strong>在哈希之前，给每个用户加一段随机字符串</strong>。这段东西叫「盐」。</p>\n<p>```<br>哈希(盐 + 密码)<br>```</p>\n<p>你的盐是 `kX9#m`，我的盐是 `p2$Qz`。就算我们俩密码都是 `abc123`，算出来的哈希完全不同。</p>\n<p>盐和哈希一起存在表里——<strong>盐不需要保密</strong>，它的作用只是让预先算好的表失效。因为攻击者的表是按「无盐」算的，你的盐一加，那几亿条全部作废，他必须针对你这条单独重算。</p>\n<p>## 五、还不够：让哈希变慢</p>\n<p>加盐解决了「查表」，但没解决「逐条暴力破解」。密码短、字典小的话，照样能在合理时间内算完。</p>\n<p>于是又一步：<strong>让哈希函数故意变慢</strong>。</p>\n<p>普通的哈希（如 SHA-256）追求快；密码哈希恰恰相反，要设计成计算一次要花几十毫秒。这样攻击者每秒能试的次数从几十亿降到几万，成本上升几十万倍。</p>\n<p>这类专用函数有现成的：bcrypt、scrypt、Argon2。<strong>任何正经网站在 2026 年都应该用它们，而不是自己拿 SHA-256 凑。</strong></p>\n<p>## 六、哈希不是加密</p>\n<p>这两件事经常被混淆，但区别是根本性的：</p>\n<p>| | 加密 | 哈希 |<br>|---|---|---|<br>| 能不能还原 | 能（有密钥） | 不能 |<br>| 用途 | 传输、存储可还原的内容 | 验证内容一致 |<br>| 类比 | 上锁的箱子 | 指纹 |</p>\n<p>网站存密码用哈希，是因为它<strong>永远不需要知道你的密码</strong>——只需要知道「你输的和上次那个是不是同一个」。既然不需要，就不该有能力知道。</p>\n<p>反过来，如果一个网站给你发「您的密码是 xxx」的邮件，这只有一个解释：<strong>它存了明文</strong>。这是个危险信号，你应该换掉那个密码，并且以后少用它。</p>\n<p>## 七、你能做的事</p>\n<p>不用懂算法，只要做三件事：</p>\n<p><strong>第一，重要的账号不复用密码。</strong> 邮箱和支付工具的密码必须是独有的——因为它们是「找回其他所有账号」的钥匙。</p>\n<p><strong>第二，用密码管理器。</strong> 记不住二十个随机密码不是你的问题，是记忆机制的问题。浏览器自带的也行，至少比 `名字+生日+123` 强。</p>\n<p><strong>第三，能开两步验证就开。</strong> 它的价值在于：即使密码泄露，攻击者仍然过不了第二关。而且它防的正是本篇文章描述的那类事故。</p>\n<p>## 八、最后</p>\n<p>这篇没有一个数字需要你记住，但有一个判断标准值得带走：</p>\n<p><strong>下次看到「某网站被拖库」，先问一句「他们存的是哈希还是明文」。</strong> 如果是加盐的慢哈希，你的密码大概率没用；如果是明文，那才是真麻烦。</p>\n<p>这一个问题，就能把「恐慌」换成「判断」。</p>", "source": "长文 002 · 密码哈希与加盐为公开技术知识，可对照 OWASP 密码存储备忘单核实", "file": "002-密码的指纹.md"}, {"title": "平均数会骗人：三个数字陷阱", "html": "<p>看到一个数字，人的第一反应是「哦，是这样」。</p>\n<p>但数字本身不带含义，<strong>它靠的是你默认接受的那套算法</strong>。而这套算法，有三个地方经常被人有意无意地用错。</p>\n<p>这篇讲三个最常见的，都是你以后会在新闻、论文、广告里反复遇到的。</p>\n<p>## 陷阱一：平均数被少数人拉走</p>\n<p>假设一间办公室有 10 个人，9 个人月薪 6000，老板月薪 60 万。</p>\n<p>平均月薪 = （9×6000 + 600000）÷ 10 = <strong>65400 元</strong>。</p>\n<p>这个数字真实、算得没错，但它描述的「平均那个人」根本不存在——10 个人里 9 个远低于它。</p>\n<p>问题出在哪？<strong>平均数对极端值极其敏感。</strong> 一个极大的数就能把它整个拽走。</p>\n<p>所以更稳的是<strong>中位数</strong>：把所有人的收入排成一队，站在正中间那个人的数。在这个例子里，中位数是 6000。</p>\n<p>「平均工资 65400」和「中位数工资 6000」都没撒谎，但后者才告诉你「普通人是什么样」。</p>\n<p><strong>经验法则</strong>：凡是分布有长尾巴的东西——收入、房价、阅读量、粉丝数、代码提交次数——看中位数比看平均数可靠。</p>\n<p>## 陷阱二：幸存者偏差（只看活下来的）</p>\n<p>二战时有个著名的故事：工程师统计返航飞机的弹孔分布，发现机翼弹孔最多，引擎最少，于是提议加固机翼。</p>\n<p>结论恰好反了。<strong>因为被击中引擎的飞机根本没回来</strong>——你统计到的样本，是已经通过筛选的那部分。</p>\n<p>这就是幸存者偏差：<strong>当样本的「存活」本身与你要研究的东西相关时，剩下的样本不能代表全体。</strong></p>\n<p>它在生活里到处都是：</p>\n<p>- 「×× 辍学创业成了亿万富翁」——那些辍学创业失败的人没有记者采访<br>- 「每天跑 10 公里，我身体特别好」——跑出问题的人已经退出跑圈了<br>- 「用了这个方法，我考上了」——没考上的不会发帖</p>\n<p><strong>经验法则</strong>：看到「他们都成功了」的时候，先问「失败的那批人为什么不在样本里」。</p>\n<p>## 陷阱三：百分比没告诉你基数</p>\n<p>「风险降低 50%」听起来很厉害，但它没说降低的是从多少降到多少。</p>\n<p>如果原来 1000 个人里有 2 个人得病，降低 50% 是变成 1 个人。你为了这 1 个人，可能要吃十年药、体检一千次。</p>\n<p>如果原来是 1000 个人里有 200 个，降低 50% 就是少 100 个人——这才是真值得。</p>\n<p><strong>这叫「相对风险」与「绝对风险」的区别。</strong> 新闻里说的「降低 XX%」，绝大多数是相对值。而决定你要不要行动的是<strong>绝对值</strong>。</p>\n<p><strong>经验法则</strong>：看到百分比，一定要问「基数是多大」。答不出来，那个百分比就没有决策价值。</p>\n<p>## 把三个陷阱连起来看</p>\n<p>你会发现它们在问同一件事：<strong>这个数字，是在描述「谁」？</strong></p>\n<p>- 平均数问的是「这个样本里有没有极端值」<br>- 幸存者偏差问的是「这个样本是怎么被筛出来的」<br>- 百分比基数问的是「这个比例背后站着多少人」</p>\n<p>三个问题都不需要数学知识，只需要一个习惯：<strong>看到数字，问一句它描述的是哪一个群体。</strong></p>\n<p>## 你现在可以做的练习</p>\n<p>下面三句话，各藏着一个陷阱，你可以先自己判断，再看括号里的答案：</p>\n<p>1. 「我们学校毕业生平均起薪 1.2 万。」（平均数：有没有极少数高薪把人拉上去？中位数是多少？）<br>2. 「坚持早起的人，成功率高 30%。」（幸存者偏差 + 因果倒置：可能是成功的人更容易早起，而不是反过来）<br>3. 「这款牙膏能降低牙龈出血 45%。」（基数：原来出血率是多少？1% 降到 0.55% 值不值？）</p>\n<p>下次再遇到类似的说法，不用算，只要问一句：<strong>它在描述谁？</strong></p>", "source": "长文 003 · 平均数与中位数的差异、幸存者偏差均为公开统计学常识，可对照任意统计学导论教材核实", "file": "003-平均数会骗人.md"}], "bits": [{"title": "小菜 001 · 「论题」和「结论」不是一回事", "html": "<p>一条消息里通常有两样东西，很多人只看见第二样。</p>\n<p><strong>论题</strong>是问题本身：该不该熬夜？哪种学习方法更有效？这两个哪个更值得买？</p>\n<p><strong>结论</strong>是作者对这个问题给出的答案：不该熬夜、间隔重复更有效、买左边那个。</p>\n<p>## 为什么要分清</p>\n<p>因为<strong>论题决定了结论的分量</strong>。</p>\n<p>描述性论题问「是什么」，答案可以被事实推翻：「中国大学生平均每晚睡 6.8 小时」——查一下就知道了。</p>\n<p>规定性论题问「应该怎样」，答案没有标准解：「大学生应该 11 点睡」——这句话背后一定有某个价值判断（健康优先于自由，还是反过来）。</p>\n<p>把规定性论题当成描述性论题来吵，是最常见的无效争论：一个人说「应该」，另一个人拿数据反驳「实际不是这样」，两边根本不在同一个层面上。</p>\n<p>## 今天可以做的</p>\n<p>读一条消息时，先找那个<strong>问号</strong>。找不到问号，说明作者没打算回答具体问题——那他大概只是想表达情绪。</p>", "source": "小菜 · 概念速记", "file": "001-论题与结论.md"}, {"title": "小菜 002 · 「假设」是什么：作者没说出口的那句话", "html": "<p>一篇文章要成立，除了它写出来的理由，还必须依赖一些<strong>没写出来、但你必须接受</strong>的东西。这就是假设。</p>\n<p>## 一个例子</p>\n<p>「这台笔记本续航 12 小时，值得买。」</p>\n<p>表面上理由很硬：12 小时。但它依赖至少两个假设：</p>\n<p>1. 你确实需要长续航（不是一直插电用）<br>2. 12 小时是在你能接受的条件下测出来的（亮度、负载、几年后电池衰减）</p>\n<p>这两个假设都没写在文章里。如果第一个不成立，理由再硬也跟你无关。</p>\n<p>## 两类假设</p>\n<p><strong>描述性假设</strong>：关于世界是怎样的。「这个测评是独立做的」——它可能是枪文，那结论就废了。</p>\n<p><strong>价值观假设</strong>：关于什么更重要。「续航比性能重要」——这是价值判断，不是事实。</p>\n<p>## 为什么它有用</p>\n<p>因为一个论证的弱点，八成藏在假设里。理由通常都是真的（12 小时确实测出来了），出问题的是那句没说出口的前提。</p>\n<p>## 今天可以做的</p>\n<p>看到「所以」，往前推一步：<strong>要让这个「所以」成立，什么必须是真的？</strong> 那句话往往就是假设。</p>", "source": "小菜 · 概念速记", "file": "002-假设是什么.md"}, {"title": "小菜 003 · 规模错觉：一条命是新闻，一百万人是数字", "html": "<p>一条新闻说「某地发生事故，3 人死亡」，你会心头一紧。</p>\n<p>同一条新闻说「今年全球道路交通事故死亡约 119 万人」，你会毫无感觉。</p>\n<p><strong>同一个数量级的两端，感受却完全相反。</strong></p>\n<p>## 为什么</p>\n<p>因为人对<strong>单个、具体、有画面</strong>的事件会起反应，对<strong>大规模、抽象、无画面</strong>的数字不起反应。</p>\n<p>这是注意力的机制，不是冷漠。大脑没法为 119 万个人难过，它只会为一个人难过。</p>\n<p>## 后果</p>\n<p>结果是：<strong>你关注的事，和你真正面临的风险，常常不匹配。</strong></p>\n<p>媒体每天报道的死亡原因，和统计上真正的死因排名，差得很远。凶杀、空难、恐袭有画面，所以占据版面；而高血压、吸烟、交通事故数量级更大，却没有画面。</p>\n<p>## 一个校正方法</p>\n<p>看到一个数字时，问一句：<strong>它的分母是什么？</strong></p>\n<p>「3 人死亡」——在哪、多少人里？「119 万」——全世界多少人？</p>\n<p>把两个数字放到同一个分母上，你才知道哪个更值得担心。</p>\n<p>## 今天可以做的</p>\n<p>下次被一个新闻惊到，先别急着转发。问一句：这件事在一年里发生多少次？和其它死因比，排第几？</p>\n<p>答不上来，就说明你被画面而不是被数字影响了。</p>", "source": "小菜 · 概念速记", "file": "003-规模错觉.md"}, {"title": "小菜 004 · 以偏概全：你见过的，不等于存在的", "html": "<p>你在食堂看到的十个人，八个在刷短视频。</p>\n<p>于是你得出：现在的大学生都在刷短视频。</p>\n<p><strong>问题在于，那十个人是你碰巧看到的。</strong></p>\n<p>## 机制</p>\n<p>人脑会自动用\"我见过的样本\"去推断整体。这个机制在原始环境里很有效——你见过的果子有毒，就别吃。</p>\n<p>但它有个致命前提：<strong>样本必须代表整体</strong>。而现实中的样本几乎总是偏的。</p>\n<p>## 三种常见的偏</p>\n<p>| 偏法 | 例子 |<br>|---|---|<br>| <strong>地点偏</strong> | 在一线城市看到的现象，当成全国的样子 |<br>| <strong>时间偏</strong> | 开学第一周的状态，当成整个学期 |<br>| <strong>人群偏</strong> | 你所在专业的情况，当成所有专业 |</p>\n<p>## 校正方法</p>\n<p>看到一个结论时，问一句：<strong>这个样本是怎么选出来的？</strong></p>\n<p>如果答案是\"我碰巧看到的\"\"我身边的人\"，那它不是样本，是印象。</p>\n<p>要让印象变成证据，至少得回答：样本多大、从哪来、和整体差在哪。</p>\n<p>## 今天可以做的</p>\n<p>想想你最近笃定的一个判断，比如\"现在的人都不读书了\"。它是从多少个人、什么场合得来的？</p>\n<p>如果不到二十个、还都在同一类场合，就先把它降级成\"我见过的\"。</p>", "source": "小菜 · 概念速记", "file": "004-以偏概全.md"}, {"title": "小菜 005 · 情急生乱：越催你决定，越要慢一步", "html": "<p>「限时优惠，还剩 3 小时。」</p>\n<p>「名额有限，先到先得。」</p>\n<p>「你必须马上做出选择。」</p>\n<p>这几句话有一个共同点：<strong>它们都在制造时间压力</strong>。</p>\n<p>## 为什么时间压力有效</p>\n<p>因为人在有充足时间时，会调用理性分析；时间一紧，大脑就切回本能反应——先动起来再说。</p>\n<p>这是生存机制：面对狮子时，犹豫等于死。所以\"急\"会强制关闭思考。</p>\n<p>## 谁在利用它</p>\n<p>卖东西的人、做营销的人，以及——<strong>你自己</strong>。</p>\n<p>当你催自己\"这事必须今天定下来\"，你其实在对自己施加同一种压力。</p>\n<p>## 一个检验</p>\n<p>判断一个决定该不该急，只看一件事：<strong>不做决定，后果是什么？</strong></p>\n<p>- 错过一个优惠 → 后果是多花几十块<br>- 买错一套房 → 后果是几十万</p>\n<p><strong>真正紧急的事很少</strong>，大部分\"限时\"是人为设定的。而人为的截止时间，通常说明对方希望你来不及想。</p>\n<p>## 今天可以做的</p>\n<p>下次有人在催你决定，先在心里问一句：<strong>如果给我三天，我会做什么决定？</strong></p>\n<p>如果答案是\"不一样的决定\"，那说明你被时间压力影响了，而不是被理由说服了。</p>", "source": "小菜 · 概念速记", "file": "005-情急生乱.md"}, {"title": "小菜 006 · 命中注定：别把\"还没变\"当成\"变不了\"", "html": "<p>有个说法很常见：这地方一直这么穷，改不了。这行业一直这样，没救。</p>\n<p>「一直」是个很危险的时间尺度——它往往只覆盖了你看得见的那一段。</p>\n<p>## 机制</p>\n<p>人会把当前的稳定状态，自动外推成永久状态。因为变化是缓慢的，而观察是短暂的。</p>\n<p>《事实》把它列成一种本能：把事物看成\"固有的、不会再变的\"。</p>\n<p>## 一个检验</p>\n<p>判断\"命中注定\"这个说法站不站得住，只问一句：<strong>过去二十年，它变过吗？</strong></p>\n<p>- 如果变过，那\"变不了\"是错的<br>- 如果没变，也不代表不能变，只代表<strong>慢变量还没到拐点</strong></p>\n<p>区分这两件事很重要：<strong>\"没变\"是观察，\"变不了\"是断言。</strong> 前者可以有证据，后者只能靠猜。</p>\n<p>## 今天可以做的</p>\n<p>找一件你觉得\"就是这样、改不了\"的事（个人的、环境的都行），问自己：五年前的它，和现在一样吗？</p>\n<p>如果不一样，那你的\"命中注定\"其实只是\"最近没动\"。</p>", "source": "小菜 · 概念速记", "file": "006-命中注定.md"}, {"title": "小菜 007 · 单一视角：手里拿着锤子，看什么都像钉子", "html": "<p>你有一个擅长的工具，就会不自觉地用它解释一切。</p>\n<p>学经济的看什么都像激励机制，学编程的看什么都像系统设计，当医生的看什么都像病理。</p>\n<p><strong>这不是无知，恰恰是专业带来的偏见。</strong></p>\n<p>## 机制</p>\n<p>单一视角的危险在于：它总能给出一个<strong>说得通</strong>的解释。</p>\n<p>而\"说得通\"很容易被误认为\"说对了\"。你越熟练，解释起来越顺，越不会去找别的角度。</p>\n<p>## 一个检验</p>\n<p>下次你对一件事下了很确定的判断，问一句：<strong>如果换一个专业的人来看，他会先问什么？</strong></p>\n<p>- 工程师会问：它怎么运作的<br>- 经济学家会问：谁承担成本<br>- 心理学家会问：人为什么这么做<br>- 历史学家会问：以前发生过什么</p>\n<p>四个问题问下来，你的判断通常会变得更窄、更准。</p>\n<p>## 今天可以做的</p>\n<p>拿你最近的一个判断，试着用上面四个视角各问一句。哪一句最让你不舒服，那多半就是你的盲区。</p>", "source": "小菜 · 概念速记", "file": "007-单一视角.md"}, {"title": "小菜 008 · 归咎他人：找一个人怪罪，比找原因容易", "html": "<p>出事了，人的第一反应是：<strong>这是谁的责任。</strong></p>\n<p>这个反应有其合理性——追责能防止再犯。但它常常替代了另一个更麻烦的问题：<strong>到底是什么导致的。</strong></p>\n<p>## 机制</p>\n<p>因为找\"人\"比找\"系统\"容易。</p>\n<p>系统性的原因通常是一串环环相扣的条件：流程缺陷、信息延迟、激励错位、运气不好。没有一个人能被单独拎出来负责。</p>\n<p>而找一个人怪罪，能立刻给出情绪出口，也让讨论可以结束。</p>\n<p>## 代价</p>\n<p>一旦锁定了一个\"坏人\"，调查就停了。</p>\n<p>于是同样的事会再发生一次——换个主角，同样的剧本。因为<strong>结构没变</strong>。</p>\n<p>## 一个检验</p>\n<p>看到\"都是因为某某\"的说法，问一句：<strong>如果这个人不存在，这件事还会发生吗？</strong></p>\n<p>如果答案是\"会，换个人也一样\"，那真正的原因在系统里，不在人身上。</p>\n<p>## 今天可以做的</p>\n<p>挑一件你归咎过某人的事——不管是你自己还是别人。问一句：换一个人在那个位置、那个条件下，结果会不一样吗？</p>\n<p>如果不会，那你要修的是条件，不是人。</p>", "source": "小菜 · 概念速记", "file": "008-归咎他人.md"}, {"title": "小菜 009 · 关键词歧义：「增长」到底指什么", "html": "<p>「今年公司业绩增长 30%。」</p>\n<p>听起来很清楚。但<strong>同比增长还是环比增长？营收还是利润？含不含新收购的业务？</strong></p>\n<p>三个问题问完，那个 30% 可能缩水一半。</p>\n<p>## 机制</p>\n<p>论证里最容易被动手脚的地方，不是数据，是<strong>词</strong>。</p>\n<p>因为词的意思由语境决定，而作者和你对同一个词的默认理解往往不同。他写「增长」，你脑中想的是「赚得更多」；他指的可能是「账面收入口径变了」。</p>\n<p>## 一个检验</p>\n<p>看到关键结论，把里面最核心的那个词圈出来，问一句：<strong>这个词换成另一种合理解释，结论还成立吗？</strong></p>\n<p>- 「年轻人不愿结婚」——不愿，还是没条件？<br>- 「免费」——永久免费，还是先免费用三个月？<br>- 「健康」——没有疾病，还是身体状态良好？</p>\n<p>## 今天可以做的</p>\n<p>找一条含数字的广告或新闻，圈出里面三个可能有多重解释的词。圈完你大概会发现，<strong>真正确定的只有数字本身，而数字的含义取决于那些词。</strong></p>", "source": "小菜 · 概念速记", "file": "009-关键词歧义.md"}, {"title": "小菜 010 · 替代原因：相关不等于因果", "html": "<p>「每天喝咖啡的人更长寿。」</p>\n<p>这句话可能是真的统计数据，但它证明不了咖啡让人长寿。</p>\n<p>## 可能的替代解释</p>\n<p>至少还有三种：</p>\n<p>1. <strong>反过来</strong>：身体好的人才有精力天天喝咖啡<br>2. <strong>共同原因</strong>：能天天喝咖啡的人可能收入更高、医疗条件更好<br>3. <strong>选择偏差</strong>：病重的人主动戒了咖啡，所以\"喝咖啡组\"天然更健康</p>\n<p>任何一个成立，因果关系就塌了——但<strong>相关性依然存在</strong>。</p>\n<p>## 一个检验</p>\n<p>看到「A 与 B 相关，所以 A 导致 B」，问三句：</p>\n<p>- 会不会是 B 导致 A？<br>- 有没有 C 同时导致 A 和 B？<br>- 把人群换一批，还成立吗？</p>\n<p>## 一条边界</p>\n<p>不是所有相关都需要怀疑。<strong>有机制解释的相关</strong>（比如吸烟与肺癌，有明确的生理路径）可信度远高于\"统计上有关\"。</p>\n<p>判断标准：<strong>能不能说清楚它是通过什么起作用的。</strong></p>\n<p>## 今天可以做的</p>\n<p>找一条你相信的\"因为所以\"，试着给它编一个替代原因。编得出来，就说明你的相信里有一部分是猜的。</p>", "source": "小菜 · 概念速记", "file": "010-替代原因.md"}, {"title": "小菜 011 · 样本：这个结论能代表谁", "html": "<p>「调查显示，80% 的大学生支持这项政策。」</p>\n<p>在相信之前，先看三件事：<strong>样本多大、从哪来、怎么抽的。</strong></p>\n<p>## 三种常见偏差</p>\n<p>| 偏差 | 例子 |<br>|---|---|<br>| <strong>方便抽样</strong> | 只在自己学校、自己学院发的问卷 |<br>| <strong>自选择</strong> | 愿意填问卷的人，本身就更关心这个话题 |<br>| <strong>存活偏差</strong> | 只调查还在用这个产品的人，走了的人不出现 |</p>\n<p>这三种都不算造假，但都会让结果偏向某一侧，而<strong>数字本身看起来很硬</strong>。</p>\n<p>## 一个检验</p>\n<p>问一句：<strong>这个样本和\"全体\"的差别在哪？</strong></p>\n<p>- 我学校是 985 / 双非？工科 / 文科？<br>- 问卷是在哪发的？（群里、班会上、还是随机电话）</p>\n<p>答得越具体，这个数字能用的范围就越清楚。</p>\n<p>## 一条边界</p>\n<p>小样本不是没用。<strong>精确描述一个小群体</strong>是合理的，问题只在于把它推广。</p>\n<p>「我们班 80% 的人这样」是事实；「大学生 80% 这样」是推论。中间差着一次抽样设计。</p>\n<p>## 今天可以做的</p>\n<p>看到任何\"调查显示\"，先找样本量。找不到，就把这条信息降级成\"有人这么说\"。</p>", "source": "小菜 · 概念速记", "file": "011-样本代表性.md"}, {"title": "小菜 012 · 循环论证：用结论证明结论", "html": "<p>「这本书很可靠，因为它说的都是对的。」</p>\n<p>仔细看：<strong>\"它说的都是对的\"就是\"它很可靠\"的另一种说法。</strong></p>\n<p>绕了一圈，什么也没证明。</p>\n<p>## 怎么认出来</p>\n<p>把理由和结论分别写下来，如果理由<strong>换个说法就等于结论</strong>，那就是循环。</p>\n<p>常见的变形：</p>\n<p>- 「他值得信任，因为他是个诚实的人」<br>- 「这个方案可行，因为它是可以实施的」<br>- 「数据不会骗人，因为数据是客观的」</p>\n<p>## 为什么它难被发现</p>\n<p>因为循环论证<strong>读起来很顺</strong>。</p>\n<p>它满足了\"有理由\"这个形式，大脑检测到\"因为\"两个字就放行了，不会去对比理由和结论是不是同一个东西。</p>\n<p>## 一个检验</p>\n<p>问一句：<strong>如果我不知道结论，这条理由还能独立成立吗？</strong></p>\n<p>能独立成立，才是理由；不能，就是结论照了镜子。</p>\n<p>## 今天可以做的</p>\n<p>找一句你很认同的话，把\"因为\"后面的部分单独拿出来看。它需要依赖前面的结论吗？</p>\n<p>需要，就说明你信的是它读起来对，而不是它说得通。</p>", "source": "小菜 · 概念速记", "file": "012-循环论证.md"}, {"title": "小菜 013 · 诉诸权威：专家说的，能信到哪一步", "html": "<p>「诺贝尔奖得主都说了，还能有假？」</p>\n<p>这类推理的问题不在专家，在<strong>你把判断权交出去的那一步</strong>。</p>\n<p>## 三种情况要分开</p>\n<p>| 情况 | 能不能信 |<br>|---|---|<br>| 专家的<strong>专业领域内</strong>、有具体依据 | 可以信，但要看到依据 |<br>| 专家的<strong>专业领域外</strong> | 等同于普通人 |<br>| 专家<strong>只给结论、不给过程</strong> | 只能当线索，不能当证据 |</p>\n<p>第三种最常见。因为媒体只截取结论，不给你实验设计、样本量、置信度。</p>\n<p>## 一个检验</p>\n<p>看到「某某专家说」，问两句：</p>\n<p>1. <strong>这是他的专业领域吗？</strong>（物理学家谈营养学，和一个路人差不多）<br>2. <strong>他的原话是什么？</strong>（经过三次转述的结论，通常已经变形）</p>\n<p>## 一条边界</p>\n<p>这不是要你事事自己验证——那不可能，也没必要。</p>\n<p>它的目标是：<strong>知道自己在\"相信一个人\"而不是\"相信一个论证\"。</strong> 前者是权宜之计，后者才是你真正掌握的东西。</p>\n<p>## 今天可以做的</p>\n<p>回想一个你因为\"专家说了\"而接受的结论。你能说出他的依据吗？</p>\n<p>说不出，那你信的是身份，不是理由。</p>", "source": "小菜 · 概念速记", "file": "013-诉诸权威.md"}, {"title": "小菜 014 · 稻草人：你反驳的，可能不是对方说的", "html": "<p>A：「我觉得应该减少作业量。」<br>B：「你是想让大家都别学了？那以后怎么考试？」</p>\n<p>B 反驳的不是 A 的话，是 A 的话被<strong>夸张、简化之后的样子</strong>。</p>\n<p>那个夸张版就是\"稻草人\"——打起来很容易，因为它本来就是你编的。</p>\n<p>## 三种常见做法</p>\n<p>1. <strong>扩大</strong>：把「一部分」说成「全部」<br>2. <strong>极端化</strong>：把「适度减少」说成「彻底取消」<br>3. <strong>换主体</strong>：把「这个方法有问题」说成「你反对这个方法」</p>\n<p>## 为什么有效</p>\n<p>因为它让你的反驳显得很有力，而对方需要花很多话去澄清自己没说过。</p>\n<p><strong>澄清的成本永远高于指责的成本。</strong></p>\n<p>## 一个检验</p>\n<p>反驳之前，先用一句话复述对方的观点，然后问：<strong>这是他的原话意思吗？</strong></p>\n<p>如果复述不出，说明你还没读明白，反驳就是空的。</p>\n<p>## 今天可以做的</p>\n<p>下次刷到让你想回怼的评论，先试着用一句话概括对方在说什么（不带贬义）。</p>\n<p>概括不出来，就先别回。</p>", "source": "小菜 · 概念速记", "file": "014-稻草人谬误.md"}]}, "meta": {"books": {"name": "书", "desc": "周一 / 周三 / 周五"}, "skills": {"name": "常识", "desc": "周二 / 周四"}, "weekly": {"name": "周报", "desc": "周六"}, "longform": {"name": "长文", "desc": "按需更新"}, "bits": {"name": "小菜", "desc": "每天 11:00"}}};

const fmt = d => { const p = n => String(n).padStart(2,'0'); return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; };
const DAY = 86400000;
const W = ['一','二','三','四','五','六','日'];

function today() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function bjToday() {
  const n = new Date(Date.now() + n0() + 8*3600000);
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function n0(){ return new Date().getTimezoneOffset()*60000; }

function dateAt(i){
  return new Date(Date.parse(DATA.start + "T00:00:00Z") + i*DAY);
}
function weekdayOf(d){ return (d.getUTCDay() + 6) % 7; }   // 0=周一
function todayIdx(){
  return Math.round((bjToday() - Date.parse(DATA.start + "T00:00:00Z")) / DAY);
}
function nthFor(col, upto){
  let n = 0;
  for (let i = 0; i <= upto; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col) n++;
  }
  return n;
}
function dateOfNth(col, n){
  let c = 0;
  for (let i = 0; ; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col){
      c++;
      if (c === n) return dateAt(i);
    }
    if (i > 5000) return null;
  }
}

/* ---- 已读标记 ---- */
const readKey = f => 'read:' + f;
const isRead = f => localStorage.getItem(readKey(f)) === '1';
const markRead = f => localStorage.setItem(readKey(f), '1');

let cur = localStorage.getItem('col') || 'books';
if (!DATA.columns[cur]) cur = Object.keys(DATA.columns)[0];

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = Object.keys(DATA.columns).map(k =>
    `<button class="tab${k===cur?' on':''}" data-k="${k}">${DATA.meta[k].name}</button>`
  ).join('');
  box.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    cur = el.dataset.k;
    localStorage.setItem('col', cur);
    renderTabs(); renderCol();
  });
}

function renderCol(){
  const list = DATA.columns[cur] || [];
  document.getElementById('colmeta').textContent = DATA.meta[cur].desc;

  const scheduled = [DATA.schedule || []].flat().includes(cur);
  let idx = 1, isToday = false;
  if (scheduled){
    const t = todayIdx();
    idx = Math.max(1, nthFor(cur, t));
    isToday = DATA.schedule[weekdayOf(bjToday())] === cur;
  }

  const post = document.getElementById('post');
  if (!list.length){
    post.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    document.getElementById('dateline').textContent = DATA.meta[cur].desc;
    document.getElementById('list').innerHTML = '';
    document.getElementById('historytitle').textContent = '往期';
    return;
  }

  const show = scheduled ? Math.min(idx, list.length) : list.length;
  const a = list[show - 1];
  markRead(a.file);

  if (scheduled){
    const d = dateOfNth(cur, show);
    const wd = d ? '星期' + W[weekdayOf(d)] : '';
    const dated = d ? `${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}` : '';
    document.getElementById('dateline').textContent =
      (isToday && show === idx) ? dated : `第 ${show} 篇 · ${dated}`;
  } else {
    document.getElementById('dateline').textContent = `共 ${list.length} 篇 · 按发布顺序排列`;
  }

  post.innerHTML = `<h2>${a.title}</h2>${a.html}` +
    (a.source ? `<div class="source">${a.source}</div>` : '');

  // 往期
  const rows = [];
  for (let i = list.length; i >= 1; i--){
    if (i === show) continue;
    const it = list[i-1];
    const dd = scheduled ? dateOfNth(cur, i) : null;
    const sub = dd ? `${dd.getUTCFullYear()} 年 ${dd.getUTCMonth()+1} 月 ${dd.getUTCDate()} 日` : '';
    rows.push(
      `<div class="item ${isRead(it.file)?'read':'unread'}" data-i="${i}">
         <div class="n">${String(i).padStart(2,'0')}</div>
         <div class="t">${it.title}<small>${sub}</small></div>
         <div class="dot"></div>
       </div>`
    );
  }
  document.getElementById('historytitle').textContent = `${DATA.meta[cur].name} · 往期`;
  document.getElementById('list').innerHTML = rows.join('') || '<div class="empty">还没有往期</div>';
  document.getElementById('list').querySelectorAll('.item').forEach(el => {
    el.onclick = () => openItem(+el.dataset.i);
  });

  updateCounter();
}

function updateCounter(){
  const list = DATA.columns[cur] || [];
  const readCount = list.filter(x => isRead(x.file)).length;
  const hint = cur === 'longform' ? '按需更新 · 不占排期' : '周一三五书 / 周二四技能 / 周六周报';
  document.getElementById('counter').textContent =
    `${DATA.meta[cur].name}：共 ${list.length} 篇 · 已读 ${readCount} 篇 · ${hint}`;
}

function openItem(i){
  const list = DATA.columns[cur] || [];
  const a = list[i-1];
  if (!a) return;
  markRead(a.file);
  const scheduled = [DATA.schedule || []].flat().includes(cur);
  const d = scheduled ? dateOfNth(cur, i) : null;
  const wd = d ? '星期' + W[weekdayOf(d)] : '';
  document.getElementById('dateline').textContent = d
    ? `第 ${i} 篇 · ${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}`
    : `第 ${i} 篇`;
  document.getElementById('post').innerHTML =
    `<h2>${a.title}</h2>${a.html}` + (a.source ? `<div class="source">${a.source}</div>` : '');
  window.scrollTo({top:0, behavior:'instant'});
  const el = document.querySelector('.item[data-i="' + i + '"]');
  if (el) { el.classList.remove('unread'); el.classList.add('read'); }
  updateCounter();
}

renderTabs();
renderCol();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').then(() => {
    const el = document.getElementById('pwa');
    if (el) el.textContent = '离线可读 · 可装到主屏幕';
  }).catch(() => {});
} else {
  const el = document.getElementById('pwa');
  if (el) el.textContent = '仅在线（要离线与安装需 HTTPS 站点）';
}
</script>
</body>
</html>
