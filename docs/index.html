<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>每日快报</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#111315; --card:#191c1f; --ink:#e8e6e3; --dim:#8b9096;
    --accent:#c9a227; --line:#262a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.85;font-size:17px;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  header{
    position:sticky;top:0;z-index:10;background:rgba(17,19,21,.96);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 0 0;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
  .brand .meta{font-size:11px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{
    flex:1;text-align:center;padding:8px 0 10px;font-size:14px;
    color:var(--dim);border:0;background:transparent;font-family:inherit;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .date{padding:16px 0 0;font-size:12px;color:var(--accent);letter-spacing:1px}
  article{padding:14px 0 10px}
  article h2{font-size:23px;line-height:1.45;margin:0 0 20px;letter-spacing:.3px;font-weight:600}
  article p{margin:0 0 18px}
  article strong{color:#fff;font-weight:600}
  .source{
    margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);line-height:1.7;
  }
  .history{padding:22px 0 56px}
  .history h3{font-size:11px;color:var(--dim);letter-spacing:2px;margin:0 0 12px;font-weight:500}
  .item{
    display:flex;gap:12px;align-items:flex-start;
    padding:14px 15px;margin-bottom:8px;background:var(--card);
    border-radius:12px;cursor:pointer;border:1px solid transparent;
  }
  .item:active{border-color:var(--accent)}
  .item .n{flex:0 0 auto;font-size:11px;color:var(--dim);min-width:26px;padding-top:3px}
  .item .t{font-size:15px;line-height:1.55;flex:1}
  .item .t small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
  .item.read .t{color:#8b9096}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:8px;opacity:0}
  .item.unread .dot{opacity:1}
  .empty{padding:30px 0;color:var(--dim);font-size:14px;text-align:center}
  footer{text-align:center;font-size:11px;color:#4e5459;padding:0 0 34px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>每日快报</h1>
      <span class="meta" id="colmeta"></span>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="date" id="dateline">—</div>
  <article id="post"></article>

  <section class="history">
    <h3 id="historytitle">往期</h3>
    <div id="list"></div>
  </section>

  <footer>
    <div id="counter"></div>
    <div id="pwa"></div>
    <div>内容源自公开书籍与公开课程，每个数字都可回溯</div>
  </footer>
</div>

<script>
const DATA = {"start": "2026-11-01", "schedule": ["books", "skills", "books", "skills", "books", "weekly", null], "columns": {"books": [{"title": "室友带回来一袋「山上捡的」蘑菇，我劝你别吃", "html": "<p>国庆回校，室友拎来一袋干货：「我妈在后山捡的，晒干了，特别香。」</p>\n<p>我没法判断那袋东西有没有毒——因为<strong>没有任何人能靠肉眼判断</strong>。</p>\n<p>中国疾控中心 2025 年调查了 <strong>828 起</strong>蘑菇中毒事件，<strong>2165 人</strong>中招，<strong>13 人</strong>死亡。这已是六年来最低：2019 到 2024 年每年 276 到 676 起，病死率 0.87% 到 2.86%。</p>\n<p>会毒人的蘑菇还在变多：2025 年鉴定出 <strong>138 种</strong>，其中 <strong>34 种</strong>是国内首次记录。「祖祖辈辈都这么吃」这句话，可能已经过期。</p>\n<p>那些辨别法呢？银针试毒——蘑菇毒素不含硫，银针变黑靠的恰恰是硫，跟有毒没毒无关。虫子吃过就没毒——剧毒蘑菇成熟后照样被虫啃。颜色鲜艳才有毒——有没有毒和颜色无关。高温油炸能去毒——不靠谱。</p>\n<p>中国疾控中心的结论是：「目前没有简单易行、快速有效的识别蘑菇是否有毒的方法。」</p>\n<p>所以最省事的处理就是别吃。已经吃了、觉得不对劲，立即去医院，别扛着也别自己催吐，把剩下的蘑菇或照片带上——中毒分好几种类型，医生认出是哪一种才好对症。</p>", "source": "第 1 节第 5 条 · 证据 A · 中国疾控中心 China CDC Weekly (2026)", "file": "001-hl-野生蘑菇.md"}, {"title": "比熬夜更伤的是：今晚一点睡，周末中午起", "html": "<p>室友的作息表是这样的：周一到周五凌晨一点半睡、七点半起，周末补到中午十一点。</p>\n<p>他觉得自己没熬夜——工作日欠的觉，周末一次性还清了。</p>\n<p>但身体不这么算。英国生物银行跟踪了约 6.1 万个戴腕表的人，按作息规律程度分成五档。较规律的那四档，比最不规律的那一档，死亡风险低 <strong>20% 到 48%</strong>。研究结论很直接：<strong>作息规不规律，比睡多久更能预测死亡</strong>。</p>\n<p>还有一项追踪了 51,562 人的研究，记录睡眠时刻后发现：工作日和周末的睡眠中点如果差到 <strong>2 小时以上</strong>——这叫「社会时差」——心血管病风险高约 <strong>30%</strong>。哪怕每天睡够 7 小时，这个关联照样存在。</p>\n<p>那到底睡几个小时？16 项跟踪研究合起来算，138 万人、11.3 万例死亡，结论是：<strong>7 小时那一档风险最低</strong>。少于 7 小时，每少 1 小时风险高约 6%；多于 7 小时，每多 1 小时高约 13%。</p>\n<p>这里有个容易搞反的地方：睡得长的人风险高，多半是因果颠倒了——是抑郁、慢性病、睡眠呼吸暂停让人睡得多，不是睡得多让人生病。<strong>没有人建议你少睡。</strong></p>\n<p>所以真正要改的只有两件：睡够 7 小时，把上床和起床的点固定住。</p>\n<p>不是要你早睡，是要你<strong>别在几个时区之间来回跳</strong>——周五两点、周日两点、周一十一点，身体每一次都要重调。</p>", "source": "第 2 节第 13 条 · 证据 A（作息部分单独看为 B）· Cappuccio 等 (2010) Sleep 汇总分析", "file": "002-hl-睡够七小时.md"}, {"title": "电梯等在那儿，你走楼梯上去——每天攒够四分钟就够", "html": "<p>下课回宿舍，电梯口排了七八个人。楼梯就在旁边，四层，你犹豫了三秒，还是站进队伍里。</p>\n<p>「反正也不差这一分钟。」</p>\n<p>英国生物银行跟踪了 2.52 万个平时完全不锻炼的人，平均 6.9 年，其中 852 人去世。研究里有一批人，每天有 3 次、每次 1–2 分钟的<strong>零碎剧烈活动</strong>——爬楼梯、快走赶路这种，不换衣服、不去健身房，就嵌在生活里。和完全没有的人比：</p>\n<p>- 死亡风险、癌症死亡风险降低 <strong>38%–40%</strong><br>- 心血管死亡风险降低 <strong>48%–49%</strong></p>\n<p>每天这类活动累计到 <strong>4.4 分钟</strong>的人，收益小一些但仍在：死亡和癌症死亡降 26%–30%，心血管死亡降 32%–34%。</p>\n<p>注意研究对象——<strong>平时完全不锻炼的人</strong>。如果你已经有规律运动，这条对你不适用，别拿它当替代品。</p>\n<p>也得说清它的局限：这是跟踪记录，没做分组试验，只跟了 6.9 年。好处是活动量靠可穿戴设备实测，不是让人回忆填问卷，比大多数同类研究可靠。</p>\n<p>所以这条建议的成本接近零：不花钱，不占额外时间，<strong>唯一的难点是记得</strong>——电梯来了不进去，快递柜在楼下就走快两步。</p>\n<p>四分钟，不是四十分钟。你缺的从来不是时间。</p>", "source": "第 2 节第 15 条 · 证据 A · Stamatakis 等 (2022) Nature Medicine", "file": "003-hl-零碎用力.md"}], "skills": [{"title": "你现在双击的那个图标，其实就是一条命令", "html": "<p>桌面上的 Chrome 图标，双击就能打开。命令行里敲一行字，也能打开同一个东西——差别只在于：<strong>一个用鼠标指，一个用文字说</strong>。</p>\n<p>双击时系统做的事，其实是「按记录下来的路径启动这个程序」。命令行只是把这一步交给你自己写。</p>\n<p>那为什么还要用它？因为鼠标只能做一件事一次，而文字可以<strong>组合、记录、重复</strong>：把三条命令接起来一次跑完，或者存成文件明天再跑一遍。这就是命令行真正的价值——不是更酷，是<strong>能复用</strong>。</p>\n<p>Windows 上的「PowerShell」或「命令提示符」，macOS/Linux 上的「终端」，都是同一个东西的不同外壳。看到「在终端里执行」这句话，不用紧张，它只是换了个方式打开你已经会的程序。</p>\n<p><strong>今天能懂的一点</strong>：命令行不是程序员的黑话，它是「用文字操作系统」的入口，你已经在用它的图形版。</p>", "source": "技能线 001 · 参考 MIT《计算机教育中缺失的一课》· 课程概览与 Shell", "file": "001-cli-命令行是什么.md"}, {"title": "256G 的手机，开机就只剩 230G——不是厂商骗你", "html": "<p>新手机到手，包装上写着 256G。开机进设置一看，容量那一栏写着 238.4G，再扣掉系统和预装，可用的只剩 229G 左右。</p>\n<p>很多人的第一反应是「被坑了」。其实这里面没有任何欺诈，只有两套单位在打架——而这个打架的根源，和你以后看到的每一条带宽广告都有关。</p>\n<p>## 数字是怎么对不上的</p>\n<p>厂商说的 256G，是 <strong>256 × 10⁹ 字节</strong>，也就是 2560 亿个字节。这是国际单位制里的「G」，一 G 就是十亿。</p>\n<p>系统显示的，是按 <strong>1024 进制</strong>折算的。它把 2560 亿字节除以 1024 三次，得到约 <strong>238.4</strong>，然后标上 G。</p>\n<p>同样是 2560 亿字节，一个说 256，一个说 238。差的那 7%，不是被谁拿走了，是同一个数用了两把尺子。</p>\n<p>## 为什么电脑非要用 1024</p>\n<p>这才是关键。如果只是「单位不统一」，改成统一的不就完了？改不了，因为<strong>计算机的容量天生就是 2 的幂</strong>。</p>\n<p>想想内存怎么存一个数：一根存储单元只能表示两种状态，有电或没电。这是一个比特。八根并排就是 256 种组合，够表示一个字节的全部取值。根本不需要别的进制——它就是二进制的物理实体。</p>\n<p>既然地址是按二进制编的，容量自然就长成 1、2、4、8、16、32、256、512 这样的数。你不可能买到一根「1000 个单元」的内存条，它要么是 1024，要么是 2048。</p>\n<p>于是「1024 是一千」成了这个圈子的习惯，久了就有了专门的写法：1024 进制叫 <strong>GiB</strong>，十进制叫 <strong>GB</strong>。硬盘厂按 GB 卖，操作系统按 GiB 显示，两套并行了几十年。</p>\n<p>## 这个知识有什么用</p>\n<p>它不是一个冷知识，它是一把尺子。你以后会反复用到它：</p>\n<p><strong>宽带。</strong> 办 100M 宽带，下载速度显示 12.5MB/s。不是运营商缺斤少两——这里的 M 是<strong>比特</strong>，那里的是<strong>字节</strong>，一个字节等于八个比特。100 ÷ 8 = 12.5。看懂这一条，可以少打很多客服电话。</p>\n<p><strong>内存与显存。</strong> 为什么内存条总是 8G、16G、32G，从不出现 10G？同理，它是按二进制长出来的，不是按你的喜好。</p>\n<p><strong>存储卡。</strong> 标 128G 的卡，实际写入大约 119GiB。也是这个换算。</p>\n<p>## 一条边界</p>\n<p>这套解释只适用于「容量为什么对不上」。<strong>系统占掉的那几十个 G 是真占</strong>——预装应用、恢复分区、文件系统本身的索引，这些确实是硬件之外的开销。两部分原因叠在一起，才有了「256 变 229」这个结果。</p>\n<p>## 留给你的问题</p>\n<p>既然存储是二进制的、容量总是 2 的幂，那<strong>为什么硬盘厂不干脆按 1024 卖，省得大家误会？</strong></p>\n<p>（答案下周周报里说。你也可以先自己想一想：一台标着 1TB 的硬盘，如果真按 1024 进制做，成本会高多少？）</p>", "source": "概念 002 · 二进制与容量单位 · 数据来源：IEC 80000-13 单位标准", "file": "002-概念-256G为什么变230G.md"}], "weekly": [{"title": "第 1 期 · 你其实每天只需要四分钟", "html": "<p>这是第一份周报。往后每周六早上，它会把这一周的东西串起来，再给你一个三十分钟内能做完的动作。</p>\n<p>## 本周的六篇，其实在讲同一件事</p>\n<p><strong>书线两篇</strong>：蘑菇那篇讲「没有可靠的鉴别方法，那就别赌」；睡眠那篇讲「作息规律比睡多久更要命」；今天这篇讲「每天四分钟的零碎用力就够」。</p>\n<p>拼起来是同一个判断方式：<strong>先找那条最省力的边界，再决定要不要越过它</strong>。不吃野蘑菇是省力的，固定起床时间是省力的，走楼梯是省力的——它们都不要求你变成一个更自律的人。</p>\n<p><strong>技能线两篇</strong>：命令行到底是什么、路径为什么找不到文件。这两篇没有让你立刻去做任何事，它们在做另一件事：<strong>把你每天点的图标，还原成程序和数据</strong>。</p>\n<p>## 三十分钟任务包</p>\n<p><strong>目标</strong>：让命令行第一次替你干活，而不是听你描述它。</p>\n<p>1. 按 `Win+R`，输入 `powershell`，回车（5 分钟，包括翻出这个窗口）<br>2. 敲 `cd $HOME`，回车——你会「走」到自己的用户目录<br>3. 敲 `dir`，回车——看看里面有什么，和你在资源管理器里看到的是不是同一批东西<br>4. 挑一个文件夹，`cd 它的名字`，再 `dir` 一次<br>5. 敲 `cd ..` 退回来，重复两三次</p>\n<p><strong>做完的标准</strong>：你能不看提示，说出「我现在在哪」和「怎么回上一层」。</p>\n<p>做不到也没关系——下周的技能稿会接着讲。这一步的全部意义是：让「命令行」从一个名词变成一个你摸过的东西。</p>\n<p>## 本周深度阅读</p>\n<p>| 长文 | 状态 |<br>|---|---|<br>| （本周没有） | — |</p>\n<p>第一篇长文随时可以找我要，主题由你选或者我推荐。读完再要下一篇。</p>", "source": "周报第 1 期 · 2026-11-02 至 2026-11-07", "file": "001-第1期.md"}], "longform": [], "bits": []}, "meta": {"books": {"name": "书", "desc": "周一 / 周三 / 周五"}, "skills": {"name": "常识", "desc": "周二 / 周四"}, "weekly": {"name": "周报", "desc": "周六"}, "longform": {"name": "长文", "desc": "按需更新 · 不占排期"}, "bits": {"name": "小菜", "desc": "每天 11:00 · 200-300 字"}}};

const fmt = d => { const p = n => String(n).padStart(2,'0'); return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`; };
const DAY = 86400000;
const W = ['一','二','三','四','五','六','日'];

function today() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function bjToday() {
  const n = new Date(Date.now() + n0() + 8*3600000);
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function n0(){ return new Date().getTimezoneOffset()*60000; }

function dateAt(i){
  return new Date(Date.parse(DATA.start + "T00:00:00Z") + i*DAY);
}
function weekdayOf(d){ return (d.getUTCDay() + 6) % 7; }   // 0=周一
function todayIdx(){
  return Math.round((bjToday() - Date.parse(DATA.start + "T00:00:00Z")) / DAY);
}
function nthFor(col, upto){
  let n = 0;
  for (let i = 0; i <= upto; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col) n++;
  }
  return n;
}
function dateOfNth(col, n){
  let c = 0;
  for (let i = 0; ; i++){
    if (DATA.schedule[weekdayOf(dateAt(i))] === col){
      c++;
      if (c === n) return dateAt(i);
    }
    if (i > 5000) return null;
  }
}

/* ---- 已读标记 ---- */
const readKey = f => 'read:' + f;
const isRead = f => localStorage.getItem(readKey(f)) === '1';
const markRead = f => localStorage.setItem(readKey(f), '1');

let cur = localStorage.getItem('col') || 'books';
if (!DATA.columns[cur]) cur = Object.keys(DATA.columns)[0];

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = Object.keys(DATA.columns).map(k =>
    `<button class="tab${k===cur?' on':''}" data-k="${k}">${DATA.meta[k].name}</button>`
  ).join('');
  box.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    cur = el.dataset.k;
    localStorage.setItem('col', cur);
    renderTabs(); renderCol();
  });
}

function renderCol(){
  const list = DATA.columns[cur] || [];
  document.getElementById('colmeta').textContent = DATA.meta[cur].desc;

  const scheduled = [DATA.schedule || []].flat().includes(cur);
  let idx = 1, isToday = false;
  if (scheduled){
    const t = todayIdx();
    idx = Math.max(1, nthFor(cur, t));
    isToday = DATA.schedule[weekdayOf(bjToday())] === cur;
  }

  const post = document.getElementById('post');
  if (!list.length){
    post.innerHTML = '<div class="empty">这一栏还没有内容</div>';
    document.getElementById('dateline').textContent = DATA.meta[cur].desc;
    document.getElementById('list').innerHTML = '';
    document.getElementById('historytitle').textContent = '往期';
    return;
  }

  const show = scheduled ? Math.min(idx, list.length) : list.length;
  const a = list[show - 1];
  markRead(a.file);

  if (scheduled){
    const d = dateOfNth(cur, show);
    const wd = d ? '星期' + W[weekdayOf(d)] : '';
    const dated = d ? `${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}` : '';
    document.getElementById('dateline').textContent =
      (isToday && show === idx) ? dated : `第 ${show} 篇 · ${dated}`;
  } else {
    document.getElementById('dateline').textContent = `共 ${list.length} 篇 · 按发布顺序排列`;
  }

  post.innerHTML = `<h2>${a.title}</h2>${a.html}` +
    (a.source ? `<div class="source">${a.source}</div>` : '');

  // 往期
  const rows = [];
  for (let i = list.length; i >= 1; i--){
    if (i === show) continue;
    const it = list[i-1];
    const dd = scheduled ? dateOfNth(cur, i) : null;
    const sub = dd ? `${dd.getUTCFullYear()} 年 ${dd.getUTCMonth()+1} 月 ${dd.getUTCDate()} 日` : '';
    rows.push(
      `<div class="item ${isRead(it.file)?'read':'unread'}" data-i="${i}">
         <div class="n">${String(i).padStart(2,'0')}</div>
         <div class="t">${it.title}<small>${sub}</small></div>
         <div class="dot"></div>
       </div>`
    );
  }
  document.getElementById('historytitle').textContent = `${DATA.meta[cur].name} · 往期`;
  document.getElementById('list').innerHTML = rows.join('') || '<div class="empty">还没有往期</div>';
  document.getElementById('list').querySelectorAll('.item').forEach(el => {
    el.onclick = () => openItem(+el.dataset.i);
  });

  updateCounter();
}

function updateCounter(){
  const list = DATA.columns[cur] || [];
  const readCount = list.filter(x => isRead(x.file)).length;
  const hint = cur === 'longform' ? '按需更新 · 不占排期' : '周一三五书 / 周二四技能 / 周六周报';
  document.getElementById('counter').textContent =
    `${DATA.meta[cur].name}：共 ${list.length} 篇 · 已读 ${readCount} 篇 · ${hint}`;
}

function openItem(i){
  const list = DATA.columns[cur] || [];
  const a = list[i-1];
  if (!a) return;
  markRead(a.file);
  const scheduled = [DATA.schedule || []].flat().includes(cur);
  const d = scheduled ? dateOfNth(cur, i) : null;
  const wd = d ? '星期' + W[weekdayOf(d)] : '';
  document.getElementById('dateline').textContent = d
    ? `第 ${i} 篇 · ${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日 · ${wd}`
    : `第 ${i} 篇`;
  document.getElementById('post').innerHTML =
    `<h2>${a.title}</h2>${a.html}` + (a.source ? `<div class="source">${a.source}</div>` : '');
  window.scrollTo({top:0, behavior:'instant'});
  const el = document.querySelector('.item[data-i="' + i + '"]');
  if (el) { el.classList.remove('unread'); el.classList.add('read'); }
  updateCounter();
}

renderTabs();
renderCol();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').then(() => {
    const el = document.getElementById('pwa');
    if (el) el.textContent = '离线可读 · 可装到主屏幕';
  }).catch(() => {});
} else {
  const el = document.getElementById('pwa');
  if (el) el.textContent = '仅在线（要离线与安装需 HTTPS 站点）';
}
</script>
</body>
</html>
